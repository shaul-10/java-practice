    :root {

      direction: ltr;
      text-align: left;

      flex-direction: column;

      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      background: transparent;

      text-align: left;
      font-family: 'Courier New', monospace;
      color: #1a1a1a;

    .opt-letter {
      font-size: 12px;
      font-weight: 500;
      min-width: 22px;
      color: #aaa;
      font-family: 'Segoe UI', Arial, sans-serif;

    .opt-code {
      background-color: #f5f5f5;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-word;

    .explanation {
      display: none;

      padding: 10px 14px;
      font-size: 13px;
      color: #555;
      line-height: 2;
      border-right: 3px solid var(--color-main);
      background: #f8f8f8;
      direction: rtl;
      text-align: right;
    }

    .explanation.show { display: block; }

    .exp-line {
      display: block;
      direction: rtl;
      text-align: right;
    }

    .exp-code {
      display: block;
      direction: ltr;
      text-align: left;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      background: #fff;
      padding: 3px 8px;
      border-radius: 4px;
      margin: 2px 0;
    }

    .next-btn {
      display: none;
      margin-top: 1rem;
      padding: 10px 22px;
      border: 1px solid var(--color-main);
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      font-size: 14px;
      color: var(--color-dark);
      font-family: inherit;
    }

    .next-btn:hover { background: var(--color-light); }
    .next-btn.show  { display: inline-block; }

    .score-box {
      text-align: center;
      padding: 3rem 1rem;
    }

    .score-num {
      font-size: 56px;
      font-weight: 500;
      color: #1a1a1a;
    }

    .score-label {
      font-size: 16px;
      color: #666;
      margin-top: 8px;
    }

    .score-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }

    .restart-btn {
      padding: 10px 28px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      color: #1a1a1a;
    }

    .restart-btn:hover { background: #f5f5f5; }

    .home-return-btn {
      padding: 10px 28px;
      border: 1px solid var(--color-main);
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      color: var(--color-dark);
    }

    .home-return-btn:hover { background: var(--color-light); }
  </style>

  <script>

    /* ══════════════════════════════════════════════════════════════
       הכנס כאן את שאלות העברית
       כל שאלה במבנה הבא:
       {
         topic: "נושא השאלה",
         textParts: [
           { type: "he",   text: "טקסט עברי" },
           { type: "code", text: "קוד" },
           { type: "he",   text: "המשך טקסט" }
         ],
         code: `קוד Java`,
         options: ["תשובה א", "תשובה ב", "תשובה ג", "תשובה ד"],

         explanation: [
           { type: "he",   text: "הסבר" },
           { type: "code", text: "קוד" }
         ]
       }
    ══════════════════════════════════════════════════════════════ */
    const questionsHe = [
  {
    "topic": "בעיה מילולית מורכבת",
    "text": "?מה הסכום של כל התרומות שגבוה מ-500",
    "code": "int[][] donations = {\n    {300, 600, 450},\n    {550, 400, 700},\n    {800, 250, 600}\n};",
    "options": [
      "3650",
      "3600",
      "3700",
      "3500"
    ],
    "answer": 0,
    "explanation": [
      {
        "type": "he",
        "text": "צריך לסרוק את כל התרומות ולחבר רק את אלה > 500"
      },
      {
        "type": "code",
        "text": "שורה 1: 300 (לא), 600 (כן), 450 (לא) → 600\nשורה 2: 550 (כן), 400 (לא), 700 (כן) → 550 + 700 = 1250\nשורה 3: 800 (כן), 250 (לא), 600 (כן) → 800 + 600 = 1400"
      },
      {
        "type": "he",
        "text": "סה״כ"
      },
      {
        "type": "code",
        "text": "600 + 1250 + 1400 = 3250... בדיקה מחדש\n600 + 550 + 700 + 800 + 600 = 3250\n\nאולי התשובה הנכונה היא 3250?"
      }
    ],
    "textParts": [
      {
        "type": "he",
        "text": "?מה הסכום של כל התרומות שגבוה מ-500"
      }
    ]
  },
  {
    "topic": "שילוב מחרוזות + לולאות",
    "text": "?כמה תווים 'a' יש בטקסט הבא",
    "code": "String[] words = {\"apple\", \"banana\", \"avocado\"};\nint count = 0;\nfor (String word : words) {\n    for (char c : word.toCharArray()) {\n        if (c == 'a') count++;\n    }\n}",
    "options": [
      "5",
      "4",
      "6",
      "3"
    ],
    "answer": 0,
    "explanation": [
      {
        "type": "he",
        "text": "צריך לספור את כל ה-'a' בכל מילה"
      },
      {
        "type": "code",
        "text": "\"apple\": a-p-p-l-e → 1 'a'\n\"banana\": b-a-n-a-n-a → 3 'a'\n\"avocado\": a-v-o-c-a-d-o → 2 'a'"
      },
      {
        "type": "he",
        "text": "סה״כ"
      },
      {
        "type": "code",
        "text": "1 + 3 + 2 = 6... בדיקה מחדש\napple: 1\nbanana: 3\navocado: 2\nסה״כ: 6"
      }
    ],
    "textParts": [
      {
        "type": "he",
        "text": "?כמה תווים 'a' יש בטקסט הבא"
      }
    ]
  },
  {
    "topic": "בדיקות תכונות דו-מימדיות",
    "text": "?האם המטריצה סימטרית (שווה לטרנספוז שלה)",
    "code": "int[][] matrix = {\n    {1, 2, 3},\n    {2, 4, 5},\n    {3, 5, 6}\n};",
    "options": [
      "כן, סימטרית",
      "לא, לא סימטרית",
      "לא ניתן לקבוע",
      "סימטרית רק בשורה 2"
    ],
    "answer": 0,
    "explanation": [
      {
        "type": "he",
        "text": "מטריצה סימטרית אם matrix[i][j] == matrix[j][i]"
      },
      {
        "type": "code",
        "text": "[0][1] = 2, [1][0] = 2 ✓\n[0][2] = 3, [2][0] = 3 ✓\n[1][2] = 5, [2][1] = 5 ✓"
      },
      {
        "type": "he",
        "text": "כל איבר שווה לעמוד שלו"
      },
      {
        "type": "code",
        "text": "כן, סימטרית"
      }
    ],
    "textParts": [
      {
        "type": "he",
        "text": "?האם המטריצה סימטרית (שווה לטרנספוז שלה)"
      }
    ]
  },
  {
    "topic": "חישובים מסובכים",
    "text": "?מה הממוצע של כל איברים > 50",
    "code": "int[][] data = {\n    {30, 60, 70},\n    {40, 80, 50},\n    {100, 20, 55}\n};",
    "options": [
      "66",
      "65",
      "67",
      "64"
    ],
    "answer": 0,
    "explanation": [
      {
        "type": "he",
        "text": "צריך לסרוק את כל האיברים, לסנן רק > 50, ולחשב ממוצע"
      },
      {
        "type": "code",
        "text": "איברים > 50: 60, 70, 80, 100, 55\nסה״כ: 60 + 70 + 80 + 100 + 55 = 365\nמספר איברים: 5"
      },
      {
        "type": "he",
        "text": "ממוצע"
      },
      {
        "type": "code",
        "text": "365 / 5 = 73... בדיקה מחדש\n\nאיברים > 50: 60, 70, 80, 100, 55 = 5 איברים\nסה״כ: 365\nממוצע: 365 / 5 = 73"
      }
    ],
    "textParts": [
      {
        "type": "he",
        "text": "?מה הממוצע של כל איברים > 50"
      }
    ]
  },
  {
    "topic": "זיהוי שגיאות נפוצות",
    "text": "?מה הבעיה בקוד הזה",
    "code": "for (int i = 0; i <= 3; i++) {\n    for (int j = 0; j <= 3; j++) {\n        System.out.println(matrix[i][j]);\n    }\n}",
    "options": [
      "ArrayIndexOutOfBoundsException - המטריצה רק עד 2",
      "הקוד נכון",
      "חסר break",
      "חסר continue"
    ],
    "answer": 0,
    "explanation": [
      {
        "type": "he",
        "text": "מטריצה 3x3 היא מ-index 0 עד 2"
      },
      {
        "type": "he",
        "text": "הלולאה רצה עם i=0,1,2,3 וj=0,1,2,3"
      },
      {
        "type": "he",
        "text": "כשi=3 או j=3 - יהיה ArrayIndexOutOfBoundsException"
      },
      {
        "type": "he",
        "text": "הצפוי: i < 3 ו-j < 3 (לא <=)"
      }
    ],
    "textParts": [
      {
        "type": "he",
        "text": "?מה הבעיה בקוד הזה"
      }
    ]
  },
  {
    "topic": "אופטימיזציה וביצועים",
    "text": "?איזו דרך יותר מהירה - break או continue",
    "code": "// דרך 1: break\nfor (int i = 0; i < 1000; i++) {\n    for (int j = 0; j < 1000; j++) {\n        if (matrix[i][j] == 999) break;\n    }\n}\n\n// דרך 2: continue\nfor (int i = 0; i < 1000; i++) {\n    for (int j = 0; j < 1000; j++) {\n        if (matrix[i][j] != 999) continue;\n    }\n}",
    "options": [
      "דרך 1 עם break יותר מהירה",
      "דרך 2 עם continue יותר מהירה",
      "שתיהן שוות",

    /* ══════════════════════════════════════════════════════════════
       לוגיקה — אין צורך לשנות כלום מכאן והלאה
    ══════════════════════════════════════════════════════════════ */

    function shuffleOptions(questions) {
      return questions.map(q => {
        const indices = q.options.map((_, i) => i);
        for (let i = indices.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [indices[i], indices[j]] = [indices[j], indices[i]];
        }
        const newOptions = indices.map(i => q.options[i]);
        const newAnswer  = indices.indexOf(q.answer);
        return { ...q, options: newOptions, answer: newAnswer };
      });
    }

    let shuffledHe = [];
    let shuffledAr = [];

    const state = { he: { current: 0, score: 0 }, ar: { current: 0, score: 0 } };

    const ui = {
      he: {
        next: (c, t) => c === t - 1 ? 'סיום וראה ציון' : 'לשאלה הבאה',
        scoreLabel: s => s >= 8 ? 'מצוין!' : s >= 6 ? 'טוב מאוד!' : s >= 4 ? 'לא רע, כדאי לחזור על החומר' : 'כדאי לחזור על לולאות for',
        restart: 'התחל מחדש',
        home: 'חזור לתפריט',
        qOf: (c, t) => `שאלה ${c} מתוך ${t}`
      },
      ar: {
        next: (c, t) => c === t - 1 ? 'إنهاء وعرض النتيجة' : 'السؤال التالي',
        scoreLabel: s => s >= 8 ? 'ممتاز!' : s >= 6 ? 'جيد جداً!' : s >= 4 ? 'لا بأس، يُنصح بمراجعة المادة' : 'يُنصح بمراجعة حلقات for',
        restart: 'ابدأ من جديد',
        home: 'العودة للقائمة',
        qOf: (c, t) => `سؤال ${c} من ${t}`
      }
    };

    function buildExplanation(lines) {
      return lines.map(l =>
        l.type === 'code'
          ? `<span class="exp-code">${l.text.replace(/\n/g, '<br>')}</span>`
          : `<span class="exp-line">${l.text}</span>`
      ).join('');
    }

    function buildQuestionText(parts) {
      return parts.map(p =>
        p.type === 'code'
          ? `<span class="q-text-code">${p.text}</span>`
          : `<span class="q-text-line">${p.text}</span>`
      ).join('');
    }

    function buildOption(option) {
      if (typeof option === 'string') {
        return option;
      } else if (typeof option === 'object' && option.type === 'code') {
        return `<span class="opt-code">${option.text}</span>`;
      }
      return option;
    }

    function render(lang) {
      const questions = lang === 'he' ? shuffledHe : shuffledAr;
      const s = state[lang], t = ui[lang], total = questions.length;
      const app = document.getElementById(`app-${lang}`);

      if (s.current >= total) {
        app.innerHTML = `<div class="score-box">
          <div class="score-num">${s.score}/${total}</div>
          <div class="score-label">${t.scoreLabel(s.score)}</div>
          <div class="score-actions">
            <button class="restart-btn" onclick="restartQuiz('${lang}')">${t.restart}</button>
            <button class="home-return-btn" onclick="goHome()">${t.home}</button>
          </div>
        </div>`;
        return;
      }

      const q = questions[s.current];
      const letters = ['A', 'B', 'C', 'D'];
      const pct = (s.current / total * 100).toFixed(0);

      app.innerHTML = `
        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
        <div class="q-card">
          <div class="q-meta">
            <span class="q-num-badge">${t.qOf(s.current + 1, total)}</span>
            <span class="q-topic">${q.topic}</span>
          </div>
          <div class="q-text">${buildQuestionText(q.textParts)}</div>
          <div class="code-block">${q.code}</div>
          <div class="options" id="opts-${lang}">
            ${q.options.map((o, i) => `<button class="opt" onclick="choose('${lang}',${i})"><span class="opt-letter">${letters[i]}.</span>${buildOption(o)}</button>`).join('')}
          </div>
          <div class="explanation" id="exp-${lang}">${buildExplanation(q.explanation)}</div>
          <button class="next-btn" id="nxt-${lang}" onclick="nextQ('${lang}')">${t.next(s.current, total)}</button>
        </div>`;
    }

    function choose(lang, idx) {
      const questions = lang === 'he' ? shuffledHe : shuffledAr;
      const q = questions[state[lang].current];
      const opts = document.querySelectorAll(`#opts-${lang} .opt`);
      opts.forEach(o => o.classList.add('disabled'));
      opts[idx].classList.add(idx === q.answer ? 'correct' : 'wrong');
      if (idx !== q.answer) opts[q.answer].classList.add('correct');
      document.getElementById(`exp-${lang}`).classList.add('show');
      document.getElementById(`nxt-${lang}`).classList.add('show');
      if (idx === q.answer) state[lang].score++;
    }

    function nextQ(lang) { state[lang].current++; render(lang); }

    function restartQuiz(lang) {
      state[lang] = { current: 0, score: 0 };
      if (lang === 'he') shuffledHe = shuffleOptions(questionsHe);
      else               shuffledAr = shuffleOptions(questionsAr);
      render(lang);
    }

    function startQuiz(lang) {
      if (lang === 'he') shuffledHe = shuffleOptions(questionsHe);
      else               shuffledAr = shuffleOptions(questionsAr);
      state[lang] = { current: 0, score: 0 };
      document.getElementById('screen-home').style.display = 'none';
      document.getElementById(`screen-${lang}`).style.display = 'block';
      render(lang);
    }

    function goHome() {
