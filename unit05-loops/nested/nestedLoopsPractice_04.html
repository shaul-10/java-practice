  <style>

    :root {

    .home-level-badge {

      text-align: left;

      flex-direction: column;

      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      background: transparent;

      text-align: left;
      font-family: 'Courier New', monospace;
      color: #1a1a1a;

    .opt.wrong   { background: #FCEBEB; border-color: #A32D2D; color: #791F1F; }
    .opt.disabled { pointer-events: none; }

    .opt-letter {
      font-size: 12px;
      font-weight: 500;
      min-width: 22px;
      color: #aaa;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    .opt-code {
      background-color: #f5f5f5;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .explanation {
      display: none;
      margin-top: 12px;
      padding: 10px 14px;
      font-size: 13px;
      color: #555;
      line-height: 2;
      border-right: 3px solid var(--color-main);
      background: #f8f8f8;
      direction: rtl;
      text-align: right;
    }

    .explanation.show { display: block; }

    .exp-line {
      display: block;
      direction: rtl;
      text-align: right;
    }

    .exp-code {
      display: block;
      direction: ltr;
      text-align: left;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      background: #fff;
      padding: 3px 8px;
      border-radius: 4px;
      margin: 2px 0;
    }

    .next-btn {
      display: none;
      margin-top: 1rem;
      padding: 10px 22px;
      border: 1px solid var(--color-main);
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      font-size: 14px;
      color: var(--color-dark);
      font-family: inherit;
    }

    .next-btn:hover { background: var(--color-light); }
    .next-btn.show  { display: inline-block; }

    .score-box {
      text-align: center;
      padding: 3rem 1rem;
    }

    .score-num {
      font-size: 56px;
      font-weight: 500;
      color: #1a1a1a;
    }

    .score-label {
      font-size: 16px;
      color: #666;
      margin-top: 8px;
    }

    .score-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }

    .restart-btn {
      padding: 10px 28px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      color: #1a1a1a;
    }

    .restart-btn:hover { background: #f5f5f5; }

    .home-return-btn {
      padding: 10px 28px;
      border: 1px solid var(--color-main);
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      color: var(--color-dark);
    }

    .home-return-btn:hover { background: var(--color-light); }
  </style>

  <div class="container">

          <span class="level-tag">المستوى 04</span>

  <script>

    /* ══════════════════════════════════════════════════════════════
       הכנס כאן את שאלות העברית
       כל שאלה במבנה הבא:
       {
         topic: "נושא השאלה",
         textParts: [
           { type: "he",   text: "טקסט עברי" },
           { type: "code", text: "קוד" },
           { type: "he",   text: "המשך טקסט" }
         ],
         code: `קוד Java`,
         options: ["תשובה א", "תשובה ב", "תשובה ג", "תשובה ד"],
         answer: 0,
         explanation: [
           { type: "he",   text: "הסבר" },
           { type: "code", text: "קוד" }
         ]
       }
    ══════════════════════════════════════════════════════════════ */
    const questionsHe = [
  {
    "topic": "בעיה מילולית מורכבת - עמלות מכירות",
    "text": "?מה סך כל העמלות של 3 מוכרים על פני 3 ימים (עמלה 10% רק על מכירות מעל 200)",
    "code": "int total = 0;\nfor (int day = 1; day <= 3; day++) {\n    for (int seller = 1; seller <= 3; seller++) {\n        int sales = day * seller * 100;\n        if (sales > 200) {\n            total += sales / 10;\n        }\n    }\n}\nSystem.out.println(total);",
    "options": [
      "310",
      "270",
      "350",
      "290"
    ],
    "answer": 0,
    "explanation": [
      {
        "type": "he",
        "text": "מחשבים עמלה (10%) רק כאשר sales > 200:"
      },
      {
        "type": "code",
        "text": "day=1: seller=1→100(לא), seller=2→200(לא), seller=3→300→עמלה 30\nday=2: seller=1→200(לא), seller=2→400→עמלה 40, seller=3→600→עמלה 60\nday=3: seller=1→300→עמלה 30, seller=2→600→עמלה 60, seller=3→900→עמלה 90"
      },
      {
        "type": "he",
        "text": "סה״כ עמלות:"
      },
      {
        "type": "code",
        "text": "30 + 40 + 60 + 30 + 60 + 90 = 310"
      }
    ],
    "textParts": [
      {
        "type": "he",
        "text": "?מה סך כל העמלות של 3 מוכרים על פני 3 ימים (עמלה 10% רק על מכירות מעל 200)"
      }
    ]
  },
  {
    "topic": "שילוב מחרוזות + לולאות מקוננות - מציאת מקסימום",
    "text": "?איזו מילה מודפסת בסוף הקוד",
    "code": "String w1 = \"banana\", w2 = \"avocado\", w3 = \"grape\";\nString maxWord = \"\";\nint max = 0;\nfor (int round = 1; round <= 3; round++) {\n    String word = (round == 1) ? w1 : (round == 2) ? w2 : w3;\n    int count = 0;\n    for (int j = 0; j < word.length(); j++) {\n        if (word.charAt(j) == 'a')\n            count++;\n    }\n    if (count > max) {\n        max = count;\n        maxWord = word;\n    }\n}\nSystem.out.println(maxWord);",
    "options": [
      "banana",
      "avocado",
      "grape",
      "avocadobanana"
    ],
    "answer": 0,
    "explanation": [
      {
        "type": "he",
        "text": "סופרים את מספר התווים 'a' בכל מילה:"
      },
      {
        "type": "code",
        "text": "\"banana\"  → b,a,n,a,n,a → 3 פעמים 'a'\n\"avocado\" → a,v,o,c,a,d,o → 2 פעמים 'a'\n\"grape\"   → g,r,a,p,e → 1 פעם 'a'"
      },
      {
        "type": "he",
        "text": "המילה עם הכי הרבה 'a' היא banana עם 3"
      },
      {
        "type": "code",
        "text": "maxWord = \"banana\""
      }
    ],
    "textParts": [
      {
        "type": "he",
        "text": "?איזו מילה מודפסת בסוף הקוד"
      }
    ]
  },
  {
    "topic": "ספירה של דפוסים",
    "text": "?מה הערך של count בסוף הקוד",
    "code": "int count = 0;\nfor (int i = 1; i <= 4; i++) {\n    for (int j = 1; j <= 3; j++) {\n        count++;\n    }\n    count++;\n}\nSystem.out.println(count);",
    "options": [
      "16",
      "12",
      "15",
      "18"
    ],
    "answer": 0,
    "explanation": [
      {
        "type": "he",
        "text": "הלולאה החיצונית רצה 4 פעמים"
      },
      {
        "type": "he",
        "text": "בכל סיבוב: הלולאה הפנימית מוסיפה 3, ואז עוד 1 אחריה"
      },
      {
        "type": "code",
        "text": "i=1: לולאה פנימית (+3) + אחרי (+1) = 4\ni=2: לולאה פנימית (+3) + אחרי (+1) = 4\ni=3: לולאה פנימית (+3) + אחרי (+1) = 4\ni=4: לולאה פנימית (+3) + אחרי (+1) = 4"
      },
      {
        "type": "he",
        "text": "סה״כ:"
      },
      {
        "type": "code",
        "text": "4 * 4 = 16"
      }
    ],
    "textParts": [
      {
        "type": "he",
        "text": "?מה הערך של count בסוף הקוד"
      }
    ]
  },
  {
    "topic": "חישובים מסובכים - מציאת מקסימום",
    "text": "?מה הערך המקסימלי של i*j בלולאה המקוננת ומי הזוג שמייצר אותו",
    "code": "int maxVal = 0;\nint maxI = 0, maxJ = 0;\nfor (int i = 1; i <= 4; i++) {\n    for (int j = i; j <= 4; j++) {\n        if (i * j > maxVal) {\n            maxVal = i * j;\n            maxI = i;\n            maxJ = j;\n        }\n    }\n}\nSystem.out.println(maxI + \",\" + maxJ + \"=\" + maxVal);",
    "options": [
      "4,4=16",
      "3,4=12",
      "2,4=8",
      "4,3=12"
    ],
    "answer": 0,
    "explanation": [
      {
        "type": "he",
        "text": "הלולאה הפנימית מתחילה מ-j=i (לא מ-1)"
      },
      {
        "type": "code",
        "text": "i=1: j=1,2,3,4 → מכפלות: 1,2,3,4\ni=2: j=2,3,4   → מכפלות: 4,6,8\ni=3: j=3,4     → מכפלות: 9,12\ni=4: j=4       → מכפלות: 16"
      },
      {
        "type": "he",
        "text": "הערך הגדול ביותר:"
      },
      {
        "type": "code",
        "text": "maxVal = 16, maxI = 4, maxJ = 4\nפלט: 4,4=16"
      }
    ],
    "textParts": [
      {
        "type": "he",
        "text": "?מה הערך המקסימלי של i*j בלולאה המקוננת ומי הזוג שמייצר אותו"
      }
    ]
  },
  {
    "topic": "לולאה מקוננת עם continue",
    "text": "?כמה פעמים מתבצעת ספירה",
    "code": "int count = 0;\nfor (int i = 1; i <= 3; i++) {\n    for (int j = 1; j <= 4; j++) {\n        if (j % 2 == 0) continue;\n        count++;\n    }\n}\nSystem.out.println(count);",
    "options": [
      "6",
      "12",
      "8",
      "10"
    ],
    "answer": 0,
    "explanation": [
      {
        "type": "he",
        "text": "הלולאה החיצונית רצה 3 פעמים"
      },
      {
        "type": "he",
        "text": "בכל סיבוב, מדלגים על j זוגי (2 ו-4), נספרים רק j=1 ו-j=3"
      },

        "text": "(1,1)→1✓  (1,4)→4✓  (2,2)→4✓\n(3,3)→9✓  (4,1)→4✓  (4,4)→16✓"
      },
      {
        "type": "he",
        "text": "إجمالي الأزواج التي حاصل ضربهم مربع كامل:"
      },
      {
        "type": "code",
        "text": "count = 6"
      }
    ],
    "textParts": [
      {
        "type": "he",
        "text": "?كم عدد الأزواج (i,j) بين 1 و 4 حاصل ضربهم مربع كامل"
      }
    ]
  },
  {
    "topic": "دمج كامل - حلقات متداخلة + شروط",
    "text": "?ما هي نتيجة الكود التالي",
    "code": "int result = 0;\nfor (int i = 1; i <= 5; i++) {\n    if (i % 2 == 1) {\n        for (int j = 1; j <= i; j++) {\n            result += j;\n        }\n    }\n}\nSystem.out.println(result);",
    "options": [
      "22",
      "16",
      "18",
      "25"
    ],
    "answer": 0,
    "explanation": [
      {
        "type": "he",
        "text": "الحلقة الداخلية تعمل فقط عندما يكون i فرديًا (1، 3، 5)"
      },
      {
        "type": "code",
        "text": "i=1 (فردي): j=1 → result += 1 → result=1\ni=2 (زوجي): متجاوز\ni=3 (فردي): j=1,2,3 → result += 1+2+3=6 → result=7\ni=4 (زوجي): متجاوز\ni=5 (فردي): j=1,2,3,4,5 → result += 1+2+3+4+5=15 → result=22"
      },
      {
        "type": "he",
        "text": "الإجمالي:"
      },
      {
        "type": "code",
        "text": "1 + 6 + 15 = 22"
      }
    ],
    "textParts": [
      {
        "type": "he",
        "text": "?ما هي نتيجة الكود التالي"
      }
    ]
  }
];

    /* ══════════════════════════════════════════════════════════════
       לוגיקה — אין צורך לשנות כלום מכאן והלאה
    ══════════════════════════════════════════════════════════════ */

    function shuffleOptions(questions) {
      return questions.map(q => {
        const indices = q.options.map((_, i) => i);
        for (let i = indices.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [indices[i], indices[j]] = [indices[j], indices[i]];
        }
        const newOptions = indices.map(i => q.options[i]);
        const newAnswer  = indices.indexOf(q.answer);
        return { ...q, options: newOptions, answer: newAnswer };
      });
    }

    let shuffledHe = [];
    let shuffledAr = [];

    const state = { he: { current: 0, score: 0 }, ar: { current: 0, score: 0 } };

    const ui = {
      he: {
        next: (c, t) => c === t - 1 ? 'סיום וראה ציון' : 'לשאלה הבאה',
        scoreLabel: s => s >= 8 ? 'מצוין!' : s >= 6 ? 'טוב מאוד!' : s >= 4 ? 'לא רע, כדאי לחזור על החומר' : 'כדאי לחזור על לולאות for',
        restart: 'התחל מחדש',
        home: 'חזור לתפריט',
        qOf: (c, t) => `שאלה ${c} מתוך ${t}`
      },
      ar: {
        next: (c, t) => c === t - 1 ? 'إنهاء وعرض النتيجة' : 'السؤال التالي',
        scoreLabel: s => s >= 8 ? 'ممتاز!' : s >= 6 ? 'جيد جداً!' : s >= 4 ? 'لا بأس، يُنصح بمراجعة المادة' : 'يُنصح بمراجعة حلقات for',
        restart: 'ابدأ من جديد',
        home: 'العودة للقائمة',
        qOf: (c, t) => `سؤال ${c} من ${t}`
      }
    };

    function buildExplanation(lines) {
      return lines.map(l =>
        l.type === 'code'
          ? `<span class="exp-code">${l.text.replace(/\n/g, '<br>')}</span>`
          : `<span class="exp-line">${l.text}</span>`
      ).join('');
    }

    function buildQuestionText(parts) {
      return parts.map(p =>
        p.type === 'code'
          ? `<span class="q-text-code">${p.text}</span>`
          : `<span class="q-text-line">${p.text}</span>`
      ).join('');
    }

    function buildOption(option) {
      if (typeof option === 'string') {
        return option;
      } else if (typeof option === 'object' && option.type === 'code') {
        return `<span class="opt-code">${option.text}</span>`;
      }
      return option;
    }

    function render(lang) {
      const questions = lang === 'he' ? shuffledHe : shuffledAr;
      const s = state[lang], t = ui[lang], total = questions.length;
      const app = document.getElementById(`app-${lang}`);

      if (s.current >= total) {
        app.innerHTML = `<div class="score-box">
          <div class="score-num">${s.score}/${total}</div>
          <div class="score-label">${t.scoreLabel(s.score)}</div>
          <div class="score-actions">
            <button class="restart-btn" onclick="restartQuiz('${lang}')">${t.restart}</button>
            <button class="home-return-btn" onclick="goHome()">${t.home}</button>
          </div>
        </div>`;
        return;
      }

      const q = questions[s.current];
      const letters = ['A', 'B', 'C', 'D'];
      const pct = (s.current / total * 100).toFixed(0);

      app.innerHTML = `
        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
        <div class="q-card">
          <div class="q-meta">
            <span class="q-num-badge">${t.qOf(s.current + 1, total)}</span>
            <span class="q-topic">${q.topic}</span>
          </div>
          <div class="q-text">${buildQuestionText(q.textParts)}</div>
          <div class="code-block">${q.code}</div>
          <div class="options" id="opts-${lang}">
            ${q.options.map((o, i) => `<button class="opt" onclick="choose('${lang}',${i})"><span class="opt-letter">${letters[i]}.</span>${buildOption(o)}</button>`).join('')}
          </div>
          <div class="explanation" id="exp-${lang}">${buildExplanation(q.explanation)}</div>
          <button class="next-btn" id="nxt-${lang}" onclick="nextQ('${lang}')">${t.next(s.current, total)}</button>
        </div>`;
    }

    function choose(lang, idx) {
      const questions = lang === 'he' ? shuffledHe : shuffledAr;
      const q = questions[state[lang].current];
      const opts = document.querySelectorAll(`#opts-${lang} .opt`);
      opts.forEach(o => o.classList.add('disabled'));
      opts[idx].classList.add(idx === q.answer ? 'correct' : 'wrong');
      if (idx !== q.answer) opts[q.answer].classList.add('correct');
      document.getElementById(`exp-${lang}`).classList.add('show');
      document.getElementById(`nxt-${lang}`).classList.add('show');
      if (idx === q.answer) state[lang].score++;
    }

    function nextQ(lang) { state[lang].current++; render(lang); }

    function restartQuiz(lang) {
      state[lang] = { current: 0, score: 0 };
      if (lang === 'he') shuffledHe = shuffleOptions(questionsHe);
      else               shuffledAr = shuffleOptions(questionsAr);
      render(lang);
    }

    function startQuiz(lang) {
      if (lang === 'he') shuffledHe = shuffleOptions(questionsHe);
      else               shuffledAr = shuffleOptions(questionsAr);
      state[lang] = { current: 0, score: 0 };
      document.getElementById('screen-home').style.display = 'none';
      document.getElementById(`screen-${lang}`).style.display = 'block';
      render(lang);
    }

    function goHome() {
      document.getElementById('screen-he').style.display = 'none';
      document.getElementById('screen-ar').style.display = 'none';
      document.getElementById('screen-home').style.display = 'flex';
    }

  </script>
