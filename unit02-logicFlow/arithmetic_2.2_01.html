    }

    .progress-bar-fill {

    }

      color: #fff;
      font-weight: 500;

    .q-text {
      font-size: 15px;
      margin-bottom: 12px;
      line-height: 1.8;
    }

    .q-text-line {
      display: block;
      direction: rtl;
      text-align: right;
    }

    .code-block {
      background: #f8f8f8;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 12px 14px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      margin-bottom: 14px;
      white-space: pre;
      overflow-x: auto;
      line-height: 1.7;
      direction: ltr;
      text-align: left;

    /* בלוק פלט רצוי — LTR תמיד */
    .output-block {
      background: #fff;
      border: 1px dashed var(--color-border);
      border-radius: 8px;
      padding: 10px 14px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      margin-bottom: 12px;
      white-space: pre;
      overflow-x: auto;
      line-height: 1.7;
      direction: ltr;
      text-align: left;
      color: var(--color-dark);
    }

    /* ── אפשרויות multichoice ── */
    .options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .opt {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border: 1.5px solid #E2E4F3;
      border-radius: 9px;
      cursor: pointer;
      font-size: 14px;
      background: transparent;
      width: 100%;
      direction: rtl;
      text-align: right;
      font-family: 'Courier New', monospace;
      color: #1a1a1a;
      transition: background 0.15s;
    }

    .opt:hover:not(.disabled) {
      background: #f8f8f8;
    }

    .opt.correct {
      background: #EAF3DE;
      border-color: #3B6D11;
      color: #27500A;
    }

    .opt.wrong {
      background: #FCEBEB;
      border-color: #A32D2D;
      color: #791F1F;
    }

    .opt.disabled {
      pointer-events: none;
    }

    .opt-letter {
      font-size: 12px;
      font-weight: 700;
      min-width: 22px;
      color: var(--color-main);
      font-family: 'Segoe UI', Arial, sans-serif;
      flex-shrink: 0;
    }

    .opt-text-he {
      direction: rtl;
      text-align: right;
      flex: 1;
      unicode-bidi: embed;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    .opt-code {
      background-color: #f5f5f5;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-word;
      direction: ltr;
      text-align: left;
      flex: 1;
      display: inline-block;
      text-align: left;
      direction: ltr;
    }

    /* ── gapselect ── */
    .gap-code-block {
      background: #f8f8f8;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 12px 14px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      margin-bottom: 14px;
      direction: ltr;
      text-align: left;
      line-height: 2.2;
      overflow-x: auto;
    }

    .gap-code-block .code-line {
      display: block;
      white-space: pre;
    }

    .gap-select,
    .cloze-select {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      padding: 1px 4px;
      border: 1px solid var(--color-border);
      border-radius: 4px;
      background: var(--color-light);
      color: var(--color-dark);
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .gap-select:focus,
    .cloze-select:focus {
      outline: none;
      border-color: var(--color-main);
    }

    .gap-select.correct-gap,
    .cloze-select.correct-gap {
      background: #EAF3DE;
      border-color: #3B6D11;
      color: #27500A;
    }

    .gap-select.wrong-gap,
    .cloze-select.wrong-gap {
      background: #FCEBEB;
      border-color: #A32D2D;
      color: #791F1F;
    }

    .gap-select:disabled,
    .cloze-select:disabled {
      cursor: not-allowed;
    }

    .gap-check-btn {
      margin-top: 0.75rem;
      padding: 8px 20px;
      border: 1px solid var(--color-main);
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      font-size: 13px;
      color: var(--color-dark);
      font-family: inherit;
    }

    .gap-check-btn:hover {
      background: var(--color-light);
    }

    .gap-check-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ── cloze ── */
    .cloze-block {
      background: #f8f8f8;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 12px 14px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      margin-bottom: 14px;
      direction: ltr;
      text-align: left;
      line-height: 2.4;
      overflow-x: auto;
    }

    .cloze-line {
      display: block;
      white-space: pre;
    }

    /* ── הסבר ── */
    .explanation {
      display: none;
      margin-top: 12px;
      padding: 10px 14px;
      font-size: 13px;
      color: #555;
      line-height: 2;
      border-right: 3px solid var(--color-main);
      background: #f8f8f8;
      direction: rtl;
      text-align: right;
    }

    .explanation.show {
      display: block;
    }

    .exp-line {
      display: block;
      direction: rtl;
      text-align: right;
    }

    .exp-code {
      display: block;
      direction: ltr;
      text-align: left;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      background: #fff;
      padding: 3px 8px;
      border-radius: 4px;
      margin: 2px 0;
      white-space: pre-wrap;
    }

    .next-btn {
      display: none;
      margin-top: 1rem;
      padding: 10px 22px;
      border: 1px solid var(--color-main);
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      font-size: 14px;
      color: var(--color-dark);
      font-family: inherit;
    }

    .next-btn:hover {
      background: var(--color-light);
    }

    .next-btn.show {
      display: inline-block;
    }

    .score-box {
      text-align: center;
      padding: 3rem 1rem;
    }

    .score-num {
      font-size: 56px;
      font-weight: 500;
      color: #1a1a1a;
    }

    .score-label {
      font-size: 16px;
      color: #666;
      margin-top: 8px;
    }

    .score-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }

    .restart-btn {
      padding: 10px 28px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      color: #1a1a1a;
    }

    .restart-btn:hover {
      background: #f5f5f5;
    }

    .home-return-btn {
      padding: 10px 28px;
      border: 1px solid var(--color-main);
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      color: var(--color-dark);
    }

    .home-return-btn:hover {
      background: var(--color-light);
    }
  </style>
</head>

  <div class="container">

    <!-- מסך פתיחה -->
    <div id="screen-home">

          <span class="level-tag">المستوى 01</span>

  <script>

    /* ══════════════════════════════════════════════════════════════
       הכנס כאן את שאלות העברית
    ══════════════════════════════════════════════════════════════ */
    const questionsHe = [
      {
        "type": "multichoice",
        "topic": "כיוון פעולת ההשמה",
        "text": "בתוכנית הוגדר משתנה שלם בשם ‏x. איזו מהפקודות הבאות תגרום לשגיאת קומפילציה?",
        "code": null,
        "options": [
          "5 = x;",
          "x = 5;",
          "x = x + 5;",
          "x = x;"
        ],
        "answer": 0,
        "explanation": [
          {
            "type": "he",
            "text": "משמאל לסימן ההשמה חייב להופיע משתנה, ולא מספר. שימו לב שהפקודה x = x + 5; חוקית לגמרי: מחשבים תחילה את הצד הימני, ומציבים את התוצאה בחזרה ב-x."
          },
          {
            "type": "code",
            "text": "x = 5;        // ok\nx = x + 5;    // ok\n5 = x;        // error"
          }
        ],
        "textParts": [
          {
            "type": "he",
            "text": "בתוכנית הוגדר משתנה שלם בשם ‏x. איזו מהפקודות הבאות תגרום לשגיאת קומפילציה?"
          }
        ]
      },
      {
        "type": "multichoice",
        "topic": "חילוק בין שני שלמים",
        "text": "מה יודפס בהרצת הפקודה הבאה?",
        "code": "System.out.println(9 / 2);",
        "options": [
          "4",
          "4.5",
          "5",
          "1"
        ],
        "answer": 0,
        "explanation": [
          {
            "type": "he",
            "text": "שני האופרנדים שלמים, ולכן גם התוצאה שלמה — המנה בלבד, בלי עיגול. די באופרנד ממשי אחד כדי לקבל 4.5."
          },
          {
            "type": "code",
            "text": "System.out.println(9 / 2);      // 4\nSystem.out.println(9 / 2.0);    // 4.5"
          }
        ],
        "textParts": [
          {
            "type": "he",
            "text": "מה יודפס בהרצת הפקודה הבאה?"
          }
        ]
      },
      {
        "type": "multichoice",
        "topic": "פעולת השארית",
        "text": "מה יודפס בהרצת הפקודה הבאה?",
        "code": "System.out.println(17 % 5);",
        "options": [
          "2",
          "3",
          "3.4",
          "12"
        ],
        "answer": 0,
        "explanation": [
          {
            "type": "he",
            "text": "האופרטור % מחזיר את השארית ולא את המנה: 17 הוא 3 כפול 5 ועוד 2."
          },
          {
            "type": "code",
            "text": "System.out.println(17 / 5);    // 3\nSystem.out.println(17 % 5);    // 2"
          }
        ],
        "textParts": [
          {
            "type": "he",
            "text": "מה יודפס בהרצת הפקודה הבאה?"
          }
        ]
      },
      {
        "type": "multichoice",
        "topic": "חילוק שלם מול חילוק מעורב",
        "text": "מה יהיה הפלט בהרצת קטע הקוד הבא?",
        "code": "System.out.println(10 / 4);\nSystem.out.println(10 / 4.0);",
        "options": [
          {
            "type": "code",
            "text": "2\n2.5"
          },
          {
            "type": "code",
            "text": "2.5\n2.5"
          },
          {
            "type": "code",
            "text": "2\n2"
          },
          {
            "type": "code",
            "text": "2.5\n2"
          }
        ],
        "answer": 0,
        "explanation": [
          {
            "type": "he",
            "text": "כל ההבדל בין שתי השורות הוא הנקודה העשרונית. בראשונה שני האופרנדים שלמים ולכן התוצאה שלמה, ובשנייה מעורב אופרנד ממשי — ודי בכך."
          },
          {
            "type": "code",
            "text": "System.out.println(10 / 4);      // 2\nSystem.out.println(10 / 4.0);    // 2.5\nSystem.out.println(10.0 / 4);    // 2.5"
          }
        ],
        "textParts": [
          {
            "type": "he",
            "text": "מה יהיה הפלט בהרצת קטע הקוד הבא?"
          }
        ]
      },
      {
        "type": "multichoice",
        "topic": "כתיבה מקוצרת של פעולה",
        "text": "מה יודפס בהרצת קטע הקוד הבא?",
        "code": "int count = 10;\ncount += 3;\nSystem.out.println(count);",
        "options": [
          "13",
          "3",
          "30",
          "10"
        ],
        "answer": 0,
        "explanation": [
          {
            "type": "he",
            "text": "הכתיבה המקוצרת פועלת על המשתנה עצמו — היא מוסיפה לערכו הנוכחי ואינה דורסת אותו."
          },
          {
            "type": "code",
            "text": "int count = 10;\ncount += 3;                   // count = count + 3;\nSystem.out.println(count);    // 13"
          }
        ],
        "textParts": [
          {
            "type": "he",
            "text": "מה יודפס בהרצת קטע הקוד הבא?"
          }
        ]
      },
      {
        "type": "multichoice",

          },
          {
            "before": "    System.out.println(\"score = \" + score);",
            "blank": null,
            "after": ""
          },
          {
            "before": "}",
            "blank": null,
            "after": ""
          }
        ],
        "explanation": [
          {
            "type": "he",
            "text": "نقارن كل سطر مخرجات بالسابق ونسأل أي عملية تؤدي بينها: من 4 إلى 12 بالإضافة، من 12 إلى 9 بالطرح، ومن 9 إلى 27 بالضرب. لاحظوا أن العمليتين الأخيرتين تستخدمان نفس الرقم."
          },
          {
            "type": "code",
            "text": "int score = 4;\nscore += 8;    // 12\nscore -= 3;    // 9\nscore *= 3;    // 27"
          }
        ],
        "textParts": [
          {
            "type": "he",
            "text": "معطى برنامج تكون مخرجاته بالضبط:"
          }
        ]
      }
    ];

    /* ══════════════════════════════════════════════════════════════
       לוגיקה — אין צורך לשנות כלום מכאן והלאה
    ══════════════════════════════════════════════════════════════ */

    const ui = {
      he: {
        next: (c, t) => c === t - 1 ? 'סיום וראה ציון' : 'לשאלה הבאה',
        scoreLabel: s => s >= 8 ? 'מצוין!' : s >= 6 ? 'טוב מאוד!' : s >= 4 ? 'לא רע, כדאי לחזור על החומר' : 'כדאי לחזור על החומר',
        restart: 'התחל מחדש',
        home: 'חזור לתפריט',
        qOf: (c, t) => `שאלה ${c} מתוך ${t}`,
        check: 'בדוק תשובות',
        mustAnswer: 'יש לבחור תשובה בכל התיבות'
      },
      ar: {
        next: (c, t) => c === t - 1 ? 'إنهاء وعرض النتيجة' : 'السؤال التالي',
        scoreLabel: s => s >= 8 ? 'ممتاز!' : s >= 6 ? 'جيد جداً!' : s >= 4 ? 'لا بأس، يُنصح بمراجعة المادة' : 'يُنصح بمراجعة المادة',
        restart: 'ابدأ من جديد',
        home: 'العودة للقائمة',
        qOf: (c, t) => `سؤال ${c} من ${t}`,
        check: 'تحقق من الإجابات',
        mustAnswer: 'يجب اختيار إجابة في كل الخانات'
      }
    };

    /* ── עזרים ── */

    function escHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function shuffleArr(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    /* ── הכנת שאלות: סדר קבוע, ערבוב אפשרויות בלבד ── */

    function prepMultichoice(q) {
      const idxs = shuffleArr(q.options.map((_, i) => i));
      return {
        ...q,
        options: idxs.map(i => q.options[i]),
        answer: idxs.indexOf(q.answer)
      };
    }

    function prepGapselect(q) {
      return {
        ...q,
        gaps: q.gaps.map(g => ({ ...g, options: shuffleArr(g.options) }))
      };
    }

    function prepCloze(q) {
      return {
        ...q,
        codeLines: q.codeLines.map(line =>
          line.blank
            ? { ...line, blank: { ...line.blank, options: shuffleArr(line.blank.options) } }
            : line
        )
      };
    }

    function prepareQuiz(questions) {
      return questions.map(q => {
        if (q.type === 'gapselect') return prepGapselect(q);
        if (q.type === 'cloze') return prepCloze(q);
        // ברירת מחדל: multichoice (גם שאלות ישנות ללא שדה type)
        if (q.options) return prepMultichoice(q);
        return q;
      });
    }

    /* ── מצב ── */

    const quiz = { he: [], ar: [] };
    const state = { he: { current: 0, score: 0 }, ar: { current: 0, score: 0 } };

    function startQuiz(lang) {
      const src = lang === 'he' ? questionsHe : questionsAr;
      quiz[lang] = prepareQuiz(src);
      state[lang] = { current: 0, score: 0 };
      document.getElementById('screen-home').style.display = 'none';
      document.getElementById(`screen-${lang}`).style.display = 'block';
      render(lang);
    }

    function goHome() {
      document.getElementById('screen-he').style.display = 'none';
      document.getElementById('screen-ar').style.display = 'none';
      document.getElementById('screen-home').style.display = 'flex';
    }

    function restartQuiz(lang) {
      const src = lang === 'he' ? questionsHe : questionsAr;
      quiz[lang] = prepareQuiz(src);
      state[lang] = { current: 0, score: 0 };
      render(lang);
    }

    function nextQ(lang) { state[lang].current++; render(lang); }

    /* ── בניית טקסטים ── */

    function buildText(text) {
      if (!text) return '';
      return String(text).split('\n').map(line =>
        `<span class="q-text-line">${escHtml(line)}</span>`
      ).join('');
    }

    function buildExplanation(lines) {
      return (lines || []).map(l =>
        l.type === 'code'
          ? `<span class="exp-code">${escHtml(l.text)}</span>`
          : `<span class="exp-line">${escHtml(l.text)}</span>`
      ).join('');
    }

    function buildOption(o) {
      // אפשרות מסוג קוד — תומכת בירידות שורה ורווחים
      if (typeof o === 'object' && o !== null && o.type === 'code') {
        return `<span class="opt-code">${escHtml(o.text).replace(/\n/g, '<br>')}</span>`;
      }
      const text = typeof o === 'string' ? o : String(o);
      const clean = text.replace(/\u200f/g, '').trim();
      // עברית או ערבית — RTL
      const isRtl = /^[\u0590-\u05FF\u0600-\u06FF\uFB1D-\uFB4F]/.test(clean);
      if (isRtl) {
        return `<span class="opt-text-he">${escHtml(text)}</span>`;
      }
      // קוד / אנגלית — LTR
      return `<span class="opt-code" style="background:none;padding:0;">${escHtml(text)}</span>`;
    }

    /* ── רינדור ראשי ── */

    function render(lang) {
      const questions = quiz[lang];
      const s = state[lang], t = ui[lang], total = questions.length;
      const app = document.getElementById(`app-${lang}`);

      if (s.current >= total) {
        app.innerHTML = `<div class="score-box">
          <div class="score-num">${s.score}/${total}</div>
          <div class="score-label">${t.scoreLabel(s.score)}</div>
          <div class="score-actions">
            <button class="restart-btn" onclick="restartQuiz('${lang}')">${t.restart}</button>
            <button class="home-return-btn" onclick="goHome()">${t.home}</button>
          </div>
        </div>`;
        return;
      }

      const q = questions[s.current];
      const pct = (s.current / total * 100).toFixed(0);

      let bodyHTML = '';
      if (q.type === 'gapselect') bodyHTML = renderGapselect(q, lang);
      else if (q.type === 'cloze') bodyHTML = renderCloze(q, lang);
      else bodyHTML = renderMultichoice(q, lang);

      const outputBlock = q.output
        ? `<div class="output-block">${escHtml(q.output)}</div>`
        : '';
      const text2Block = q.text2
        ? `<div class="q-text">${buildText(q.text2)}</div>`
        : '';

      app.innerHTML = `
        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
        <div class="q-card">
          <div class="q-meta">
            <span class="q-num-badge">${t.qOf(s.current + 1, total)}</span>
            <span class="q-topic">${escHtml(q.topic || '')}</span>
          </div>
          <div class="q-text">${buildText(q.text)}</div>
          ${outputBlock}
          ${text2Block}
          ${bodyHTML}
          <div class="explanation" id="exp-${lang}">${buildExplanation(q.explanation)}</div>
          <button class="next-btn" id="nxt-${lang}" onclick="nextQ('${lang}')">${t.next(s.current, total)}</button>
        </div>`;
    }

    function showExplanation(lang, correct) {
      document.getElementById(`exp-${lang}`).classList.add('show');
      document.getElementById(`nxt-${lang}`).classList.add('show');
      if (correct) state[lang].score++;
    }

    /* ── multichoice ── */

    function renderMultichoice(q, lang) {
      const letters = lang === 'he' ? ['א', 'ב', 'ג', 'ד', 'ה'] : ['أ', 'ب', 'ج', 'د', 'هـ'];
      const codeBlock = q.code
        ? `<div class="code-block">${escHtml(q.code)}</div>`
        : '';
      const opts = q.options.map((o, i) =>
        `<button class="opt" onclick="chooseOpt('${lang}',${i})">
           <span class="opt-letter">${letters[i]}.</span>${buildOption(o)}
         </button>`
      ).join('');
      return `${codeBlock}<div class="options" id="opts-${lang}">${opts}</div>`;
    }

    function chooseOpt(lang, idx) {
      const q = quiz[lang][state[lang].current];
      const opts = document.querySelectorAll(`#opts-${lang} .opt`);
      opts.forEach(o => o.classList.add('disabled'));
      const correct = (idx === q.answer);
      opts[idx].classList.add(correct ? 'correct' : 'wrong');
      if (!correct) opts[q.answer].classList.add('correct');
      showExplanation(lang, correct);
    }

    /* ── gapselect ── */

    function renderGapselect(q, lang) {
      const gapMap = {};
      q.gaps.forEach(g => { gapMap[g.id] = g; });

      const lines = q.codeLines.map(line => {
        const replaced = escHtml(line).replace(/\[\[(\d+)\]\]/g, (_, id) => {
          const gap = gapMap[parseInt(id)];
          const opts = ['<option value="" selected disabled>?</option>']
            .concat(gap.options.map(o => `<option value="${escHtml(o)}">${escHtml(o)}</option>`))
            .join('');
          return `<select class="gap-select" id="gap-${lang}-${id}">${opts}</select>`;
        });
        return `<span class="code-line">${replaced}</span>`;
      }).join('');

      return `
        <div class="gap-code-block">${lines}</div>
        <button class="gap-check-btn" id="gap-check-${lang}" onclick="checkGaps('${lang}')">${ui[lang].check}</button>`;
    }

    function checkGaps(lang) {
      const q = quiz[lang][state[lang].current];
      const unanswered = q.gaps.some(gap => {
        const sel = document.getElementById(`gap-${lang}-${gap.id}`);
        return sel && sel.value === '';
      });
      if (unanswered) { alert(ui[lang].mustAnswer); return; }

      let allCorrect = true;
      q.gaps.forEach(gap => {
        const sel = document.getElementById(`gap-${lang}-${gap.id}`);
        if (!sel) return;
        sel.disabled = true;
        if (sel.value === gap.answer) {
          sel.classList.add('correct-gap');
        } else {
          sel.classList.add('wrong-gap');
          allCorrect = false;
        }
      });
      document.getElementById(`gap-check-${lang}`).disabled = true;
      showExplanation(lang, allCorrect);
    }

    /* ── cloze ── */

    function renderCloze(q, lang) {
      const lines = q.codeLines.map((line, li) => {
        if (!line.blank) {
          return `<span class="cloze-line">${escHtml(line.before)}${escHtml(line.after)}</span>`;
        }
        const id = `cloze-${lang}-${li}`;
        const opts = ['<option value="" selected disabled>?</option>']
          .concat(line.blank.options.map(o =>
            `<option value="${escHtml(o)}">${escHtml(o)}</option>`
          )).join('');
        return `<span class="cloze-line">${escHtml(line.before)}<select class="cloze-select" id="${id}">${opts}</select>${escHtml(line.after)}</span>`;
      }).join('');

      return `
        <div class="cloze-block">${lines}</div>
        <button class="gap-check-btn" id="cloze-check-${lang}" onclick="checkCloze('${lang}')">${ui[lang].check}</button>`;
    }

    function checkCloze(lang) {
      const q = quiz[lang][state[lang].current];
      const blanks = q.codeLines
        .map((line, li) => ({ line, li }))
        .filter(x => x.line.blank);

      const unanswered = blanks.some(x => {
        const sel = document.getElementById(`cloze-${lang}-${x.li}`);
        return sel && sel.value === '';
      });
      if (unanswered) { alert(ui[lang].mustAnswer); return; }

      let allCorrect = true;
      blanks.forEach(x => {
        const sel = document.getElementById(`cloze-${lang}-${x.li}`);
        if (!sel) return;
        sel.disabled = true;
        if (sel.value === x.line.blank.answer) {
          sel.classList.add('correct-gap');
        } else {
          sel.classList.add('wrong-gap');
          allCorrect = false;
        }
      });
      document.getElementById(`cloze-check-${lang}`).disabled = true;
      showExplanation(lang, allCorrect);
    }

  </script>
</body>

</html>
