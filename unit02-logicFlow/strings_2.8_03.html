    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {

    }

    .container { max-width: 680px; margin: 0 auto; }

    :root {

      --color-light:  #FCE8E8;

    .home-title-ar { font-size: 20px; font-weight: 600; color: #1a1a1a; margin-bottom: 0.5rem; direction: rtl; }

    .home-sub .he { display: block; direction: rtl; }
    .home-sub .ar { display: block; direction: rtl; }
    .home-level-badge {
      display: inline-block; font-size: 12px; font-weight: 600;
      padding: 3px 14px; border-radius: 20px;
      background: var(--color-light); color: var(--color-dark);
      border: 1px solid var(--color-border);
      margin-top: 0.6rem; margin-bottom: 2.5rem;
    }
    .lang-buttons { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
    .lang-btn {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      padding: 22px 36px; border: 2px solid #ddd; border-radius: 14px;
      background: #fff; cursor: pointer; font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s; min-width: 160px;
    }
    .lang-btn:hover { border-color: var(--color-main); box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
    .lang-btn .lang-name { font-size: 16px; font-weight: 600; color: #1a1a1a; }
    .lang-btn .lang-sub  { font-size: 11px; color: #aaa; }

    /* ── מסכי שאלון ── */
    #screen-he, #screen-ar { display: none; }
    .quiz-header {
      display: flex; justify-content: space-between; align-items: center;
      background: linear-gradient(135deg, var(--color-dark), var(--color-main)); color: #fff;
      padding: 18px 24px; border-radius: 12px;
      margin-bottom: 1.5rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }
    .quiz-title { font-size: 18px; font-weight: 700; color: #fff; direction: rtl; }
    .quiz-title .level-tag {
      font-size: 11px; font-weight: 600; padding: 2px 10px; border-radius: 20px;
      background: rgba(255,255,255,0.2); color: #fff;
      margin-right: 8px; vertical-align: middle;
    }
    .back-btn {
      font-size: 12px; color: #fff; background: none;
      border: 1px solid rgba(255,255,255,0.4); border-radius: 6px;
      padding: 4px 12px; cursor: pointer; font-family: inherit; white-space: nowrap;
    }
    .back-btn:hover { background: rgba(255,255,255,0.15); }

    .progress-bar-bg { height: 4px; background: #ddd; border-radius: 2px; margin-bottom: 1.5rem; }
    .progress-bar-fill { height: 4px; background: var(--color-main); border-radius: 2px; transition: width 0.4s; }

    .q-card {
      background: #fff; border: 1px solid #E2E4F3;
      border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem;

    .q-text { font-size: 15px; margin-bottom: 12px; line-height: 1.8; }
    .q-text-line { display: block; direction: rtl; text-align: right; }

    .code-block {
      background: #f8f8f8; border: 1px solid #e5e5e5; border-radius: 8px;
      padding: 12px 14px; font-family: 'Courier New', monospace; font-size: 13px;
      margin-bottom: 14px; white-space: pre; overflow-x: auto;
      line-height: 1.7; direction: ltr; text-align: left;
    }

    /* בלוק פלט רצוי — LTR תמיד */
    .output-block {
      background: #fff; border: 1px dashed var(--color-border); border-radius: 8px;
      padding: 10px 14px; font-family: 'Courier New', monospace; font-size: 13px;
      margin-bottom: 12px; white-space: pre; overflow-x: auto;
      line-height: 1.7; direction: ltr; text-align: left;
      color: var(--color-dark);
    }

    /* ── אפשרויות multichoice ── */
    .options { display: flex; flex-direction: column; gap: 8px; }
    .opt {
      display: flex; flex-direction: row; align-items: center; gap: 10px;
      padding: 10px 14px; border: 1.5px solid #E2E4F3; border-radius: 9px;
      cursor: pointer; font-size: 14px; background: transparent;
      width: 100%; direction: rtl; text-align: right;
      font-family: 'Courier New', monospace; color: #1a1a1a; transition: background 0.15s;
    }
    .opt:hover:not(.disabled) { background: #f8f8f8; }
    .opt.correct { background: #EAF3DE; border-color: #3B6D11; color: #27500A; }
    .opt.wrong   { background: #FCEBEB; border-color: #A32D2D; color: #791F1F; }
    .opt.disabled { pointer-events: none; }
    .opt-letter { font-size: 12px; font-weight: 700; min-width: 22px; color: var(--color-main); font-family: 'Segoe UI', Arial, sans-serif; flex-shrink: 0; }
    .opt-text-he {
      direction: rtl; text-align: right; flex: 1;
      unicode-bidi: embed; font-family: 'Segoe UI', Arial, sans-serif;
    }
    .opt-code {
      background-color: #f5f5f5; padding: 2px 6px; border-radius: 3px;
      font-family: 'Courier New', monospace; font-size: 13px;
      white-space: pre-wrap; word-break: break-word;
      direction: ltr; text-align: left; flex: 1;
      display: inline-block; text-align: left; direction: ltr;
    }

    /* ── gapselect ── */
    .gap-code-block {
      background: #f8f8f8; border: 1px solid #e5e5e5; border-radius: 8px;
      padding: 12px 14px; font-family: 'Courier New', monospace; font-size: 13px;
      margin-bottom: 14px; direction: ltr; text-align: left;
      line-height: 2.2; overflow-x: auto;
    }
    .gap-code-block .code-line { display: block; white-space: pre; }
    .gap-select, .cloze-select {
      font-family: 'Courier New', monospace; font-size: 13px;
      padding: 1px 4px; border: 1px solid var(--color-border);
      border-radius: 4px; background: var(--color-light);
      color: var(--color-dark); cursor: pointer;
      transition: border-color 0.15s;
    }
    .gap-select:focus, .cloze-select:focus { outline: none; border-color: var(--color-main); }
    .gap-select.correct-gap, .cloze-select.correct-gap { background: #EAF3DE; border-color: #3B6D11; color: #27500A; }
    .gap-select.wrong-gap,   .cloze-select.wrong-gap   { background: #FCEBEB; border-color: #A32D2D; color: #791F1F; }
    .gap-select:disabled, .cloze-select:disabled { cursor: not-allowed; }

    .gap-check-btn {
      margin-top: 0.75rem; padding: 8px 20px;
      border: 1px solid var(--color-main); border-radius: 8px;
      background: transparent; cursor: pointer; font-size: 13px;
      color: var(--color-dark); font-family: inherit;
    }
    .gap-check-btn:hover { background: var(--color-light); }
    .gap-check-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── cloze ── */
    .cloze-block {
      background: #f8f8f8; border: 1px solid #e5e5e5; border-radius: 8px;
      padding: 12px 14px; font-family: 'Courier New', monospace; font-size: 13px;
      margin-bottom: 14px; direction: ltr; text-align: left;
      line-height: 2.4; overflow-x: auto;
    }
    .cloze-line { display: block; white-space: pre; }

    /* ── הסבר ── */
    .explanation {
      display: none; margin-top: 12px; padding: 10px 14px;
      font-size: 13px; color: #555; line-height: 2;
      border-right: 3px solid var(--color-main);
      background: #f8f8f8; direction: rtl; text-align: right;
    }
    .explanation.show { display: block; }
    .exp-line { display: block; direction: rtl; text-align: right; }
    .exp-code {
      display: block; direction: ltr; text-align: left;
      font-family: 'Courier New', monospace; font-size: 12px;
      background: #fff; padding: 3px 8px; border-radius: 4px; margin: 2px 0;
      white-space: pre-wrap;
    }

    .next-btn {
      display: none; margin-top: 1rem; padding: 10px 22px;
      border: 1px solid var(--color-main); border-radius: 8px;
      background: transparent; cursor: pointer; font-size: 14px;
      color: var(--color-dark); font-family: inherit;
    }
    .next-btn:hover { background: var(--color-light); }
    .next-btn.show  { display: inline-block; }

    .score-box { text-align: center; padding: 3rem 1rem; }
    .score-num { font-size: 56px; font-weight: 500; color: #1a1a1a; }
    .score-label { font-size: 16px; color: #666; margin-top: 8px; }
    .score-actions { display: flex; gap: 12px; justify-content: center; margin-top: 1.5rem; flex-wrap: wrap; }
    .restart-btn {
      padding: 10px 28px; border: 1px solid #ccc; border-radius: 8px;
      background: transparent; cursor: pointer; font-size: 14px; font-family: inherit; color: #1a1a1a;
    }
    .restart-btn:hover { background: #f5f5f5; }
    .home-return-btn {
      padding: 10px 28px; border: 1px solid var(--color-main); border-radius: 8px;
      background: transparent; cursor: pointer; font-size: 14px; font-family: inherit; color: var(--color-dark);
    }
    .home-return-btn:hover { background: var(--color-light); }
  </style>
</head>

  <script>

    /* ══════════════════════════════════════════════════════════════

    const questionsHe = [
  {
    "type": "multichoice",
    "topic": "השורה שנשארה בתור",
    "text": "המשתמש הקליד שתי שורות, כמופיע בהערות. הסוגריים המרובעים בהדפסה נועדו להראות את גבולות הערך. מה יהיה פלט התוכנית?",
    "code": "// input line 1:  25\n// input line 2:  David Choen\npublic static void main(String [] args) {\n    Scanner scan = new Scanner(System.in);\n    int age = scan.nextInt();\n    String name = scan.nextLine();\n    System.out.println(\"age = \" + age);\n    System.out.println(\"name = [\" + name + \"]\");\n}",
    "options": [
      {
        "type": "code",
        "text": "age = 25\nname = []"
      },

        "type": "code",

    ],
    "answer": 0,
    "explanation": [
      {
        "type": "he",
        "text": "קליטת המספר עוצרת בסוף המספר ומשאירה את שארית השורה בתור. הקליטה הבאה לוקחת את השארית הריקה הזו ולא את השורה שאחריה."
      },
      {
        "type": "code",
        "text": "int age = scan.nextInt();          // 25, rest of line 1 stays\nString name = scan.nextLine();     // empty"
      }
    ],
    "textParts": [
      {
        "type": "he",
        "text": "המשתמש הקליד שתי שורות, כמופיע בהערות. הסוגריים המרובעים בהדפסה נועדו להראות את גבולות הערך. מה יהיה פלט התוכנית?"
      }
    ]
  },
  {
    "type": "multichoice",
    "topic": "סילוק השורה שנשארה בתור",
    "text": "לתוכנית מהשאלה הקודמת נוספה שורה אחת, והקלט זהה. מה יהיה פלט התוכנית כעת?",
    "code": "// input line 1:  25\n// input line 2:  David Choen\npublic static void main(String [] args) {\n    Scanner scan = new Scanner(System.in);\n    int age = scan.nextInt();\n    scan.nextLine();\n    String name = scan.nextLine();\n    System.out.println(\"age = \" + age);\n    System.out.println(\"name = [\" + name + \"]\");\n}",
    "options": [
      {
        "type": "code",
        "text": "age = 25\nname = [David Choen]"
      },
      {
        "type": "code",
        "text": "age = 25\nname = []"
      },
      {
        "type": "code",
        "text": "age = 25\nname = [David]"
      },
      "שגיאת ריצה — אין מספיק שורות קלט"
    ],
    "answer": 0,
    "explanation": [
      {
        "type": "he",
        "text": "הקליטה הנוספת בולעת את שארית השורה הריקה שהשאיר המספר. לכן הקליטה שאחריה מתחילה בשורה הבאה וקולטת אותה במלואה."
      },
      {
        "type": "code",
        "text": "int age = scan.nextInt();          // 25\nscan.nextLine();                   // swallows the rest of line 1\nString name = scan.nextLine();     // David Choen"
      }
    ],
    "textParts": [
      {
        "type": "he",
        "text": "לתוכנית מהשאלה הקודמת נוספה שורה אחת, והקלט זהה. מה יהיה פלט התוכנית כעת?"
      }
    ]
  },
  {
    "type": "multichoice",
    "topic": "מחרוזת שנבנית בהדרגה",
    "text": "המשתמש הקליד את שורת הקלט שבהערה. מה יהיה פלט התוכנית?",
    "code": "// input line:  85\npublic static void main(String [] args) {\n    Scanner scan = new Scanner(System.in);\n    int grade = scan.nextInt();\n    String msg = \"result\";\n    if (grade >= 90) {\n        msg = msg + \" excellent\";\n    } else if (grade >= 70) {\n        msg = msg + \" good\";\n    }\n    if (grade >= 60) {\n        msg = msg + \" pass\";\n    }\n    System.out.println(msg);\n}",
    "options": [
      "result good pass",
      "result excellent good pass",
      "result good",
      "result pass"
    ],
    "answer": 0,
    "explanation": [
      {
        "type": "he",
        "text": "שרשרת התנאים בוחרת ענף אחד בלבד, אך התנאי הנפרד שאחריה נבדק בכל מקרה. כל צירוף מוסיף לערך שהצטבר עד כה."
      },
      {
        "type": "code",
        "text": "grade >= 90    // false\ngrade >= 70    // true  -> result good\ngrade >= 60    // true  -> result good pass"
      }
    ],
    "textParts": [
      {
        "type": "he",
        "text": "המשתמש הקליד את שורת הקלט שבהערה. מה יהיה פלט התוכנית?"
      }
    ]
  },
  {
    "type": "multichoice",
    "topic": "איתור התקלה בהשוואה",
    "text": "המשתמש הקליד את שתי שורות הקלט שבהערות, ובשתיהן את הסיסמה הנכונה. מה יהיה פלט התוכנית?",
    "code": "// input line 1:  abcde\n// input line 2:  abcde\npublic static void main(String [] args) {\n    Scanner scan = new Scanner(System.in);\n    String password = \"abcde\";\n    String guess = scan.nextLine();\n    if (password == guess) {\n        System.out.println(\"first ok\");\n    } else {\n        System.out.println(\"first failed\");\n        guess = scan.nextLine();\n        if (password.equals(guess)) {\n            System.out.println(\"second ok\");\n        } else {\n            System.out.println(\"second failed\");\n        }\n    }\n}",
    "options": [
      {
        "type": "code",
        "text": "first failed\nsecond ok"
      },
      "first ok",
      {
        "type": "code",
        "text": "first failed\nsecond failed"
      },
      {
        "type": "code",
        "text": "first ok\nsecond ok"
      }
    ],
    "answer": 0,
    "explanation": [
      {
        "type": "he",
        "text": "שתי הבדיקות מקבלות בדיוק את אותו קלט ומגיעות לתוצאות הפוכות. רק הבדיקה השנייה משווה את תוכן המחרוזות."
      },
      {
        "type": "code",
        "text": "password == guess          // false\npassword.equals(guess)     // true"
      }
    ],
    "textParts": [
      {
        "type": "he",
        "text": "המשתמש הקליד את שתי שורות הקלט שבהערות, ובשתיהן את הסיסמה הנכונה. מה יהיה פלט התוכנית?"
      }
    ]
  },
  {
    "type": "multichoice",
    "topic": "אורך ותו במיקום",
    "text": "בתוכנית מופיעות שתי פקודות של מחלקת המחרוזות: ‏length מחזירה את מספר התווים במחרוזת, ו-‏charAt מחזירה את התו שבמקום הנתון כאשר הספירה מתחילה באפס.\nהמשתמש הקליד את שורת הקלט שבהערה. מה יהיה פלט התוכנית?",
    "code": "// input line:  computer\npublic static void main(String [] args) {\n    Scanner scan = new Scanner(System.in);\n    String word = scan.next();\n    int n = word.length();\n    char mid = word.charAt(n / 2);\n    System.out.println(\"n = \" + n);\n    System.out.println(\"mid = \" + mid);\n}",
    "options": [
      {
        "type": "code",
        "text": "n = 8\nmid = u"
      },
      {

    /* ══════════════════════════════════════════════════════════════
       לוגיקה — אין צורך לשנות כלום מכאן והלאה
    ══════════════════════════════════════════════════════════════ */

    const ui = {
      he: {
        next: (c, t) => c === t - 1 ? 'סיום וראה ציון' : 'לשאלה הבאה',
        scoreLabel: s => s >= 8 ? 'מצוין!' : s >= 6 ? 'טוב מאוד!' : s >= 4 ? 'לא רע, כדאי לחזור על החומר' : 'כדאי לחזור על החומר',
        restart: 'התחל מחדש',
        home: 'חזור לתפריט',
        qOf: (c, t) => `שאלה ${c} מתוך ${t}`,
        check: 'בדוק תשובות',
        mustAnswer: 'יש לבחור תשובה בכל התיבות'
      },
      ar: {
        next: (c, t) => c === t - 1 ? 'إنهاء وعرض النتيجة' : 'السؤال التالي',
        scoreLabel: s => s >= 8 ? 'ممتاز!' : s >= 6 ? 'جيد جداً!' : s >= 4 ? 'لا بأس، يُنصح بمراجعة المادة' : 'يُنصح بمراجعة المادة',
        restart: 'ابدأ من جديد',
        home: 'العودة للقائمة',
        qOf: (c, t) => `سؤال ${c} من ${t}`,
        check: 'تحقق من الإجابات',
        mustAnswer: 'يجب اختيار إجابة في كل الخانات'
      }
    };

    /* ── עזרים ── */

    function escHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function shuffleArr(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    /* ── הכנת שאלות: סדר קבוע, ערבוב אפשרויות בלבד ── */

    function prepMultichoice(q) {
      const idxs = shuffleArr(q.options.map((_, i) => i));
      return {
        ...q,
        options: idxs.map(i => q.options[i]),
        answer:  idxs.indexOf(q.answer)
      };
    }

    function prepGapselect(q) {
      return {
        ...q,
        gaps: q.gaps.map(g => ({ ...g, options: shuffleArr(g.options) }))
      };
    }

    function prepCloze(q) {
      return {
        ...q,
        codeLines: q.codeLines.map(line =>
          line.blank
            ? { ...line, blank: { ...line.blank, options: shuffleArr(line.blank.options) } }
            : line
        )
      };
    }

    function prepareQuiz(questions) {
      return questions.map(q => {
        if (q.type === 'gapselect') return prepGapselect(q);
        if (q.type === 'cloze')     return prepCloze(q);
        // ברירת מחדל: multichoice (גם שאלות ישנות ללא שדה type)
        if (q.options) return prepMultichoice(q);
        return q;
      });
    }

    /* ── מצב ── */

    const quiz  = { he: [], ar: [] };
    const state = { he: { current: 0, score: 0 }, ar: { current: 0, score: 0 } };

    function startQuiz(lang) {
      const src = lang === 'he' ? questionsHe : questionsAr;
      quiz[lang] = prepareQuiz(src);
      state[lang] = { current: 0, score: 0 };
      document.getElementById('screen-home').style.display = 'none';
      document.getElementById(`screen-${lang}`).style.display = 'block';
      render(lang);
    }

    function goHome() {
      document.getElementById('screen-he').style.display = 'none';
      document.getElementById('screen-ar').style.display = 'none';
      document.getElementById('screen-home').style.display = 'flex';
    }

    function restartQuiz(lang) {
      const src = lang === 'he' ? questionsHe : questionsAr;
      quiz[lang] = prepareQuiz(src);
      state[lang] = { current: 0, score: 0 };
      render(lang);
    }

    function nextQ(lang) { state[lang].current++; render(lang); }

    /* ── בניית טקסטים ── */

    function buildText(text) {
      if (!text) return '';
      return String(text).split('\n').map(line =>
        `<span class="q-text-line">${escHtml(line)}</span>`
      ).join('');
    }

    function buildExplanation(lines) {
      return (lines || []).map(l =>
        l.type === 'code'
          ? `<span class="exp-code">${escHtml(l.text)}</span>`
          : `<span class="exp-line">${escHtml(l.text)}</span>`
      ).join('');
    }

    function buildOption(o) {
      // אפשרות מסוג קוד — תומכת בירידות שורה ורווחים
      if (typeof o === 'object' && o !== null && o.type === 'code') {
        return `<span class="opt-code">${escHtml(o.text).replace(/\n/g, '<br>')}</span>`;
      }
      const text = typeof o === 'string' ? o : String(o);
      const clean = text.replace(/\u200f/g, '').trim();
      // עברית או ערבית — RTL
      const isRtl = /^[\u0590-\u05FF\u0600-\u06FF\uFB1D-\uFB4F]/.test(clean);
      if (isRtl) {
        return `<span class="opt-text-he">${escHtml(text)}</span>`;
      }
      // קוד / אנגלית — LTR
      return `<span class="opt-code" style="background:none;padding:0;">${escHtml(text)}</span>`;
    }

    /* ── רינדור ראשי ── */

    function render(lang) {
      const questions = quiz[lang];
      const s = state[lang], t = ui[lang], total = questions.length;
      const app = document.getElementById(`app-${lang}`);

      if (s.current >= total) {
        app.innerHTML = `<div class="score-box">
          <div class="score-num">${s.score}/${total}</div>
          <div class="score-label">${t.scoreLabel(s.score)}</div>
          <div class="score-actions">
            <button class="restart-btn" onclick="restartQuiz('${lang}')">${t.restart}</button>
            <button class="home-return-btn" onclick="goHome()">${t.home}</button>
          </div>
        </div>`;
        return;
      }

      const q   = questions[s.current];
      const pct = (s.current / total * 100).toFixed(0);

      let bodyHTML = '';
      if      (q.type === 'gapselect') bodyHTML = renderGapselect(q, lang);
      else if (q.type === 'cloze')     bodyHTML = renderCloze(q, lang);
      else                             bodyHTML = renderMultichoice(q, lang);

      const outputBlock = q.output
        ? `<div class="output-block">${escHtml(q.output)}</div>`
        : '';
      const text2Block = q.text2
        ? `<div class="q-text">${buildText(q.text2)}</div>`
        : '';

      app.innerHTML = `
        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
        <div class="q-card">
          <div class="q-meta">
            <span class="q-num-badge">${t.qOf(s.current + 1, total)}</span>
            <span class="q-topic">${escHtml(q.topic || '')}</span>
          </div>
          <div class="q-text">${buildText(q.text)}</div>
          ${outputBlock}
          ${text2Block}
          ${bodyHTML}
          <div class="explanation" id="exp-${lang}">${buildExplanation(q.explanation)}</div>
          <button class="next-btn" id="nxt-${lang}" onclick="nextQ('${lang}')">${t.next(s.current, total)}</button>
        </div>`;
    }

    function showExplanation(lang, correct) {
      document.getElementById(`exp-${lang}`).classList.add('show');
      document.getElementById(`nxt-${lang}`).classList.add('show');
      if (correct) state[lang].score++;
    }

    /* ── multichoice ── */

    function renderMultichoice(q, lang) {
      const letters = lang === 'he' ? ['א', 'ב', 'ג', 'ד', 'ה'] : ['أ', 'ب', 'ج', 'د', 'هـ'];
      const codeBlock = q.code
        ? `<div class="code-block">${escHtml(q.code)}</div>`
        : '';
      const opts = q.options.map((o, i) =>
        `<button class="opt" onclick="chooseOpt('${lang}',${i})">
           <span class="opt-letter">${letters[i]}.</span>${buildOption(o)}
         </button>`
      ).join('');
      return `${codeBlock}<div class="options" id="opts-${lang}">${opts}</div>`;
    }

    function chooseOpt(lang, idx) {
      const q    = quiz[lang][state[lang].current];
      const opts = document.querySelectorAll(`#opts-${lang} .opt`);
      opts.forEach(o => o.classList.add('disabled'));
      const correct = (idx === q.answer);
      opts[idx].classList.add(correct ? 'correct' : 'wrong');
      if (!correct) opts[q.answer].classList.add('correct');
      showExplanation(lang, correct);
    }

    /* ── gapselect ── */

    function renderGapselect(q, lang) {
      const gapMap = {};
      q.gaps.forEach(g => { gapMap[g.id] = g; });

      const lines = q.codeLines.map(line => {
        const replaced = escHtml(line).replace(/\[\[(\d+)\]\]/g, (_, id) => {
          const gap = gapMap[parseInt(id)];
          const opts = ['<option value="" selected disabled>?</option>']
            .concat(gap.options.map(o => `<option value="${escHtml(o)}">${escHtml(o)}</option>`))
            .join('');
          return `<select class="gap-select" id="gap-${lang}-${id}">${opts}</select>`;
        });
        return `<span class="code-line">${replaced}</span>`;
      }).join('');

      return `
        <div class="gap-code-block">${lines}</div>
        <button class="gap-check-btn" id="gap-check-${lang}" onclick="checkGaps('${lang}')">${ui[lang].check}</button>`;
    }

    function checkGaps(lang) {
      const q = quiz[lang][state[lang].current];
      const unanswered = q.gaps.some(gap => {
        const sel = document.getElementById(`gap-${lang}-${gap.id}`);
        return sel && sel.value === '';
      });
      if (unanswered) { alert(ui[lang].mustAnswer); return; }

      let allCorrect = true;
      q.gaps.forEach(gap => {
        const sel = document.getElementById(`gap-${lang}-${gap.id}`);
        if (!sel) return;
        sel.disabled = true;
        if (sel.value === gap.answer) {
          sel.classList.add('correct-gap');
        } else {
          sel.classList.add('wrong-gap');
          allCorrect = false;
        }
      });
      document.getElementById(`gap-check-${lang}`).disabled = true;
      showExplanation(lang, allCorrect);
    }

    /* ── cloze ── */

    function renderCloze(q, lang) {
      const lines = q.codeLines.map((line, li) => {
        if (!line.blank) {
          return `<span class="cloze-line">${escHtml(line.before)}${escHtml(line.after)}</span>`;
        }
        const id = `cloze-${lang}-${li}`;
        const opts = ['<option value="" selected disabled>?</option>']
          .concat(line.blank.options.map(o =>
            `<option value="${escHtml(o)}">${escHtml(o)}</option>`
          )).join('');
        return `<span class="cloze-line">${escHtml(line.before)}<select class="cloze-select" id="${id}">${opts}</select>${escHtml(line.after)}</span>`;
      }).join('');

      return `
        <div class="cloze-block">${lines}</div>
        <button class="gap-check-btn" id="cloze-check-${lang}" onclick="checkCloze('${lang}')">${ui[lang].check}</button>`;
    }

    function checkCloze(lang) {
      const q = quiz[lang][state[lang].current];
      const blanks = q.codeLines
        .map((line, li) => ({ line, li }))
        .filter(x => x.line.blank);

      const unanswered = blanks.some(x => {
        const sel = document.getElementById(`cloze-${lang}-${x.li}`);
        return sel && sel.value === '';
      });
      if (unanswered) { alert(ui[lang].mustAnswer); return; }

      let allCorrect = true;
      blanks.forEach(x => {
        const sel = document.getElementById(`cloze-${lang}-${x.li}`);
        if (!sel) return;
        sel.disabled = true;
        if (sel.value === x.line.blank.answer) {
          sel.classList.add('correct-gap');
        } else {
          sel.classList.add('wrong-gap');
          allCorrect = false;
        }
      });
      document.getElementById(`cloze-check-${lang}`).disabled = true;
      showExplanation(lang, allCorrect);
    }

  </script>
</body>

</html>
