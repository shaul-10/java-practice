  <script>

    /* ══════════════════════════════════════════════════════════════
       הכנס כאן את שאלות העברית
    ══════════════════════════════════════════════════════════════ */
    const questionsHe = [
      {
        "type": "multichoice",
        "topic": "סדר פעולות ותוצאה במשתנה ממשי",
        "text": "מה יהיה הפלט בהרצת קטע הקוד הבא?",
        "code": "double x = 3 + 7 / 2 * 2;\nSystem.out.println(\"x = \" + x);",
        "options": [
          "x = 9.0",
          "x = 10.0",
          "x = 9",
          "x = 4.0"
        ],
        "answer": 0,
        "explanation": [
          {
            "type": "he",
            "text": "החילוק והכפל קודמים לחיבור ומתבצעים משמאל לימין, ושניהם בין שלמים — לכן 7 חלקי 2 מחזיר 3. סוג המשתנה משפיע על אופן ההצגה בלבד."
          },
          {
            "type": "code",
            "text": "int    part = 7 / 2 * 2;    // 6\ndouble x    = 3 + part;     // 9.0"
          }
        ],
        "textParts": [
          {
            "type": "he",
            "text": "מה יהיה הפלט בהרצת קטע הקוד הבא?"
          }
        ]
      },
      {
        "type": "multichoice",
        "topic": "ביטוי שאינו מוצב באף מקום",
        "text": "מה יהיה הפלט בהרצת קטע הקוד הבא?",
        "code": "int a = 9, b = 4;\na + b / 2;\nSystem.out.println(\"a = \" + a);",
        "options": [
          "שגיאת קומפילציה",
          "a = 11",
          "a = 9",
          "a = 6"
        ],
        "answer": 0,
        "explanation": [
          {
            "type": "he",
            "text": "הביטוי אמנם מחושב, אך התוצאה אינה מוצבת בשום מקום — ושורה כזו אינה פקודה חוקית בשפה. כדי שהערך יישמר נדרשת השמה מפורשת."
          },
          {
            "type": "code",
            "text": "a + b / 2;        // error\na = a + b / 2;    // ok -> 11\na += b / 2;       // ok -> 11"
          }
        ],
        "textParts": [
          {
            "type": "he",
            "text": "מה יהיה הפלט בהרצת קטע הקוד הבא?"
          }
        ]
      },
      {
        "type": "cloze",
        "topic": "בחירת אופרנד ואופרטור לפי הפלט",
        "text": "נתונה תוכנית שהפלט שלה הוא בדיוק:",
        "output": "a = 5\nb = 6.5\nc = 1",
        "text2": "השלימו את הביטויים כך שיתקבל בדיוק הפלט המבוקש:",
        "codeLines": [
          {
            "before": "public static void main(String [] args) {",
            "blank": null,
            "after": ""
          },
          {
            "before": "    int n = 13;",
            "blank": null,
            "after": ""
          },
          {
            "before": "    System.out.println(\"a = \" + (n / ",
            "blank": {
              "options": [
                "2",
                "2.0",
                "3"
              ],
              "answer": "2"
            },
            "after": " - 1));"
          },
          {
            "before": "    System.out.println(\"b = \" + (n / ",
            "blank": {
              "options": [
                "2.0",
                "2",
                "4"
              ],
              "answer": "2.0"
            },
            "after": "));"
          },
          {
            "before": "    System.out.println(\"c = \" + (n ",
            "blank": {
              "options": [
                "%",
                "/",
                "-"
              ],
              "answer": "%"
            },
            "after": " 6));"
          },
          {
            "before": "}",
            "blank": null,
            "after": ""
          }
        ],
        "explanation": [
          {
            "type": "he",
            "text": "בשורה הראשונה החילוק בשלמים מקצץ ל-6, ורק אחריו מתבצע החיסור. בשנייה אותו מחולק עם מחלק ממשי מחזיר תוצאה מדויקת, ובשלישית נדרשת השארית ולא המנה."
          },
          {
            "type": "code",
            "text": "int    a = 13 / 2 - 1;    // 5\ndouble b = 13 / 2.0;      // 6.5\nint    c = 13 % 6;        // 1"
          }
        ],
        "textParts": [
          {
            "type": "he",
            "text": "נתונה תוכנית שהפלט שלה הוא בדיוק:"
          }
        ]
      },
      {
        "type": "multichoice",
        "topic": "שארית עם אופרנד ממשי",
        "text": "מה יודפס בהרצת הפקודה הבאה?",
        "code": "System.out.println(9 % 2.5);",
        "options": [
          "1.5",
          "1",
          "0.5",
          "3.6"
        ],
        "answer": 0,
        "explanation": [
          {
            "type": "he",
            "text": "האופרטור % פועל גם בממשיים: 2.5 נכנס ב-9 שלוש פעמים, ונותר 1.5. מכיוון שמעורב אופרנד ממשי, גם התוצאה ממשית."
          },
          {
            "type": "code",
            "text": "System.out.println(9 % 2.5);    // 1.5\nSystem.out.println(9 % 2);      // 1"
          }
        ],
        "textParts": [
          {
            "type": "he",
            "text": "מה יודפס בהרצת הפקודה הבאה?"
          }
        ]
      },
      {

          },
          {

            "text": "int a = 8;\nint b = a--;    // b = 8, a = 7\nint c = --a;    // a = 6, c = 6"

        "textParts": [
          {

          }

      },
      {

        "topic": "سلسلة عمليات مختصرة",
        "text": "معطى برنامج تكون مخرجاته بالضبط:",
        "output": "x = 6\ny = 2\nz = 14",
        "text2": "أكمل العمليات المختصرة بحيث يتم الحصول على المخرجات المطلوبة بالضبط:",
        "codeLines": [
          "public static void main(String [] args) {",
          "    int x = 20, y = 20, z = 20;",
          "    x [[1]] 6;",

          "}"
        ],

          },
          {

            "text": "x /= 6;    // 20 -> 3\nx *= 2;    // 3  -> 6\ny %= 6;    // 20 -> 2\nz -= 6;    // 20 -> 14"
          }
        ],
        "textParts": [
          {

          }
        ]
      },
      {
        "type": "cloze",
        "topic": "الزيادة قبل وبعد في الطباعة",
        "text": "معطى برنامج المخرجات له هي بالضبط:",
        "output": "a = 5\nb = 7\nc = 3",
        "text2": "أكملوا التعابير بحيث يتم الحصول على المخرجات المطلوبة بالضبط:",
        "codeLines": [
          {
            "before": "public static void main(String [] args) {",
            "blank": null,
            "after": ""
          },
          {
            "before": "    int n = 5;",
            "blank": null,
            "after": ""
          },
          {
            "before": "    System.out.println(\"a = \" + ",
            "blank": {
              "options": [
                "n++",
                "++n",
                "--n"
              ],
              "answer": "n++"
            },
            "after": ");"
          },
          {
            "before": "    System.out.println(\"b = \" + ",
            "blank": {
              "options": [
                "++n",
                "n++",
                "n--"
              ],
              "answer": "++n"
            },
            "after": ");"
          },
          {
            "before": "    System.out.println(\"c = \" + ",
            "blank": {
              "options": [
                "n % 4",
                "n / 4",
                "n % 2"
              ],
              "answer": "n % 4"
            },
            "after": ");"
          },
          {
            "before": "}",
            "blank": null,
            "after": ""
          }
        ],
        "explanation": [
          {
            "type": "he",
            "text": "أيضًا في الطباعة يحدد موقع العامل ما يتم أولاً: في السطر الأول يتم طباعة القيمة القديمة وبعدها فقط يتم الزيادة، وفي الثاني تسبق الزيادة الطباعة."
          },
          {
            "type": "code",
            "text": "int n = 5;\nSystem.out.println(n++);      // 5, n = 6\nSystem.out.println(++n);      // n = 7, 7\nSystem.out.println(n % 4);    // 3"
          }
        ],
        "textParts": [
          {
            "type": "he",
            "text": "معطى برنامج المخرجات له هي بالضبط:"
          }
        ]
      }
    ];

    /* ══════════════════════════════════════════════════════════════
       לוגיקה — אין צורך לשנות כלום מכאן והלאה
    ══════════════════════════════════════════════════════════════ */

    const ui = {
      he: {
        next: (c, t) => c === t - 1 ? 'סיום וראה ציון' : 'לשאלה הבאה',
        scoreLabel: s => s >= 8 ? 'מצוין!' : s >= 6 ? 'טוב מאוד!' : s >= 4 ? 'לא רע, כדאי לחזור על החומר' : 'כדאי לחזור על החומר',
        restart: 'התחל מחדש',
        home: 'חזור לתפריט',
        qOf: (c, t) => `שאלה ${c} מתוך ${t}`,
        check: 'בדוק תשובות',
        mustAnswer: 'יש לבחור תשובה בכל התיבות'
      },
      ar: {
        next: (c, t) => c === t - 1 ? 'إنهاء وعرض النتيجة' : 'السؤال التالي',
        scoreLabel: s => s >= 8 ? 'ممتاز!' : s >= 6 ? 'جيد جداً!' : s >= 4 ? 'لا بأس، يُنصح بمراجعة المادة' : 'يُنصح بمراجعة المادة',
        restart: 'ابدأ من جديد',
        home: 'العودة للقائمة',
        qOf: (c, t) => `سؤال ${c} من ${t}`,
        check: 'تحقق من الإجابات',
        mustAnswer: 'يجب اختيار إجابة في كل الخانات'
      }
    };

    /* ── עזרים ── */

    function escHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function shuffleArr(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    /* ── הכנת שאלות: סדר קבוע, ערבוב אפשרויות בלבד ── */

    function prepMultichoice(q) {
      const idxs = shuffleArr(q.options.map((_, i) => i));
      return {
        ...q,
        options: idxs.map(i => q.options[i]),
        answer: idxs.indexOf(q.answer)
      };
    }

    function prepGapselect(q) {
      return {
        ...q,
        gaps: q.gaps.map(g => ({ ...g, options: shuffleArr(g.options) }))
      };
    }

    function prepCloze(q) {
      return {
        ...q,
        codeLines: q.codeLines.map(line =>
          line.blank
            ? { ...line, blank: { ...line.blank, options: shuffleArr(line.blank.options) } }
            : line
        )
      };
    }

    function prepareQuiz(questions) {
      return questions.map(q => {
        if (q.type === 'gapselect') return prepGapselect(q);
        if (q.type === 'cloze') return prepCloze(q);
        // ברירת מחדל: multichoice (גם שאלות ישנות ללא שדה type)
        if (q.options) return prepMultichoice(q);
        return q;
      });
    }

    /* ── מצב ── */

    const quiz = { he: [], ar: [] };
    const state = { he: { current: 0, score: 0 }, ar: { current: 0, score: 0 } };

    function startQuiz(lang) {
      const src = lang === 'he' ? questionsHe : questionsAr;
      quiz[lang] = prepareQuiz(src);
      state[lang] = { current: 0, score: 0 };
      document.getElementById('screen-home').style.display = 'none';
      document.getElementById(`screen-${lang}`).style.display = 'block';
      render(lang);
    }

    function goHome() {
      document.getElementById('screen-he').style.display = 'none';
      document.getElementById('screen-ar').style.display = 'none';
      document.getElementById('screen-home').style.display = 'flex';
    }

    function restartQuiz(lang) {
      const src = lang === 'he' ? questionsHe : questionsAr;
      quiz[lang] = prepareQuiz(src);
      state[lang] = { current: 0, score: 0 };
      render(lang);
    }

    function nextQ(lang) { state[lang].current++; render(lang); }

    /* ── בניית טקסטים ── */

    function buildText(text) {
      if (!text) return '';
      return String(text).split('\n').map(line =>
        `<span class="q-text-line">${escHtml(line)}</span>`
      ).join('');
    }

    function buildExplanation(lines) {
      return (lines || []).map(l =>
        l.type === 'code'
          ? `<span class="exp-code">${escHtml(l.text)}</span>`
          : `<span class="exp-line">${escHtml(l.text)}</span>`
      ).join('');
    }

    function buildOption(o) {
      // אפשרות מסוג קוד — תומכת בירידות שורה ורווחים
      if (typeof o === 'object' && o !== null && o.type === 'code') {
        return `<span class="opt-code">${escHtml(o.text).replace(/\n/g, '<br>')}</span>`;
      }
      const text = typeof o === 'string' ? o : String(o);
      const clean = text.replace(/\u200f/g, '').trim();
      // עברית או ערבית — RTL
      const isRtl = /^[\u0590-\u05FF\u0600-\u06FF\uFB1D-\uFB4F]/.test(clean);
      if (isRtl) {
        return `<span class="opt-text-he">${escHtml(text)}</span>`;
      }
      // קוד / אנגלית — LTR
      return `<span class="opt-code" style="background:none;padding:0;">${escHtml(text)}</span>`;
    }

    /* ── רינדור ראשי ── */

    function render(lang) {
      const questions = quiz[lang];
      const s = state[lang], t = ui[lang], total = questions.length;
      const app = document.getElementById(`app-${lang}`);

      if (s.current >= total) {
        app.innerHTML = `<div class="score-box">
          <div class="score-num">${s.score}/${total}</div>
          <div class="score-label">${t.scoreLabel(s.score)}</div>
          <div class="score-actions">
            <button class="restart-btn" onclick="restartQuiz('${lang}')">${t.restart}</button>
            <button class="home-return-btn" onclick="goHome()">${t.home}</button>
          </div>
        </div>`;
        return;
      }

      const q = questions[s.current];
      const pct = (s.current / total * 100).toFixed(0);

      let bodyHTML = '';
      if (q.type === 'gapselect') bodyHTML = renderGapselect(q, lang);
      else if (q.type === 'cloze') bodyHTML = renderCloze(q, lang);
      else bodyHTML = renderMultichoice(q, lang);

      const outputBlock = q.output
        ? `<div class="output-block">${escHtml(q.output)}</div>`
        : '';
      const text2Block = q.text2
        ? `<div class="q-text">${buildText(q.text2)}</div>`
        : '';

      app.innerHTML = `
        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
        <div class="q-card">
          <div class="q-meta">
            <span class="q-num-badge">${t.qOf(s.current + 1, total)}</span>
            <span class="q-topic">${escHtml(q.topic || '')}</span>
          </div>
          <div class="q-text">${buildText(q.text)}</div>
          ${outputBlock}
          ${text2Block}
          ${bodyHTML}
          <div class="explanation" id="exp-${lang}">${buildExplanation(q.explanation)}</div>
          <button class="next-btn" id="nxt-${lang}" onclick="nextQ('${lang}')">${t.next(s.current, total)}</button>
        </div>`;
    }

    function showExplanation(lang, correct) {
      document.getElementById(`exp-${lang}`).classList.add('show');
      document.getElementById(`nxt-${lang}`).classList.add('show');
      if (correct) state[lang].score++;
    }

    /* ── multichoice ── */

    function renderMultichoice(q, lang) {
      const letters = lang === 'he' ? ['א', 'ב', 'ג', 'ד', 'ה'] : ['أ', 'ب', 'ج', 'د', 'هـ'];
      const codeBlock = q.code
        ? `<div class="code-block">${escHtml(q.code)}</div>`
        : '';
      const opts = q.options.map((o, i) =>
        `<button class="opt" onclick="chooseOpt('${lang}',${i})">
           <span class="opt-letter">${letters[i]}.</span>${buildOption(o)}
         </button>`
      ).join('');
      return `${codeBlock}<div class="options" id="opts-${lang}">${opts}</div>`;
    }

    function chooseOpt(lang, idx) {
      const q = quiz[lang][state[lang].current];
      const opts = document.querySelectorAll(`#opts-${lang} .opt`);
      opts.forEach(o => o.classList.add('disabled'));
      const correct = (idx === q.answer);
      opts[idx].classList.add(correct ? 'correct' : 'wrong');
      if (!correct) opts[q.answer].classList.add('correct');
      showExplanation(lang, correct);
    }

    /* ── gapselect ── */

    function renderGapselect(q, lang) {
      const gapMap = {};
      q.gaps.forEach(g => { gapMap[g.id] = g; });

      const lines = q.codeLines.map(line => {
        const replaced = escHtml(line).replace(/\[\[(\d+)\]\]/g, (_, id) => {
          const gap = gapMap[parseInt(id)];
          const opts = ['<option value="" selected disabled>?</option>']
            .concat(gap.options.map(o => `<option value="${escHtml(o)}">${escHtml(o)}</option>`))
            .join('');
          return `<select class="gap-select" id="gap-${lang}-${id}">${opts}</select>`;
        });
        return `<span class="code-line">${replaced}</span>`;
      }).join('');

      return `
        <div class="gap-code-block">${lines}</div>
        <button class="gap-check-btn" id="gap-check-${lang}" onclick="checkGaps('${lang}')">${ui[lang].check}</button>`;
    }

    function checkGaps(lang) {
      const q = quiz[lang][state[lang].current];
      const unanswered = q.gaps.some(gap => {
        const sel = document.getElementById(`gap-${lang}-${gap.id}`);
        return sel && sel.value === '';
      });
      if (unanswered) { alert(ui[lang].mustAnswer); return; }

      let allCorrect = true;
      q.gaps.forEach(gap => {
        const sel = document.getElementById(`gap-${lang}-${gap.id}`);
        if (!sel) return;
        sel.disabled = true;
        if (sel.value === gap.answer) {
          sel.classList.add('correct-gap');
        } else {
          sel.classList.add('wrong-gap');
          allCorrect = false;
        }
      });
      document.getElementById(`gap-check-${lang}`).disabled = true;
      showExplanation(lang, allCorrect);
    }

    /* ── cloze ── */

    function renderCloze(q, lang) {
      const lines = q.codeLines.map((line, li) => {
        if (!line.blank) {
          return `<span class="cloze-line">${escHtml(line.before)}${escHtml(line.after)}</span>`;
        }
        const id = `cloze-${lang}-${li}`;
        const opts = ['<option value="" selected disabled>?</option>']
          .concat(line.blank.options.map(o =>
            `<option value="${escHtml(o)}">${escHtml(o)}</option>`
          )).join('');
        return `<span class="cloze-line">${escHtml(line.before)}<select class="cloze-select" id="${id}">${opts}</select>${escHtml(line.after)}</span>`;
      }).join('');

      return `
        <div class="cloze-block">${lines}</div>
        <button class="gap-check-btn" id="cloze-check-${lang}" onclick="checkCloze('${lang}')">${ui[lang].check}</button>`;
    }

    function checkCloze(lang) {
      const q = quiz[lang][state[lang].current];
      const blanks = q.codeLines
        .map((line, li) => ({ line, li }))
        .filter(x => x.line.blank);

      const unanswered = blanks.some(x => {
        const sel = document.getElementById(`cloze-${lang}-${x.li}`);
        return sel && sel.value === '';
      });
      if (unanswered) { alert(ui[lang].mustAnswer); return; }

      let allCorrect = true;
      blanks.forEach(x => {
        const sel = document.getElementById(`cloze-${lang}-${x.li}`);
        if (!sel) return;
        sel.disabled = true;
        if (sel.value === x.line.blank.answer) {
          sel.classList.add('correct-gap');
        } else {
          sel.classList.add('wrong-gap');
          allCorrect = false;
        }
      });
      document.getElementById(`cloze-check-${lang}`).disabled = true;
      showExplanation(lang, allCorrect);
    }

  </script>
