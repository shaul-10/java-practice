<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>כלי תצוגה מקדימה — שאלות JSON</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap');

:root {
  --purple:      #7F77DD;
  --purple-dark: #3C3489;
  --purple-light:#EEEDFE;
  --green:       #27AE60;
  --green-light: #E8F8EE;
  --orange:      #D4900A;
  --orange-light:#FFF3CD;
  --red:         #C0392B;
  --bg:          #F0F2FB;
  --card:        #FFFFFF;
  --text:        #1a1a2e;
  --text-muted:  #7a7a99;
  --border:      #E2E4F3;
  --code-bg:     #F4F6FB;
  --radius:      14px;
  --shadow:      0 4px 20px rgba(63,52,137,0.10);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Heebo', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  direction: rtl;
}

/* ── HEADER ── */
.app-header {
  background: var(--purple-dark);
  color: #fff;
  padding: 20px 32px;
  display: flex;
  align-items: center;
  gap: 14px;
  box-shadow: 0 2px 16px rgba(60,52,137,0.3);
}
.app-header .logo {
  width: 40px; height: 40px;
  background: var(--purple);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.3rem;
}
.app-header h1 { font-size: 1.25rem; font-weight: 700; }
.app-header p  { font-size: 0.82rem; opacity: 0.7; margin-top: 2px; }

/* ── DROP ZONE ── */
#drop-section {
  max-width: 680px;
  margin: 60px auto;
  padding: 0 20px;
}

.drop-zone {
  border: 2.5px dashed var(--purple);
  border-radius: var(--radius);
  background: var(--card);
  padding: 56px 32px;
  text-align: center;
  cursor: pointer;
  transition: all 0.25s;
  box-shadow: var(--shadow);
}
.drop-zone:hover, .drop-zone.dragover {
  background: var(--purple-light);
  border-color: var(--purple-dark);
  transform: translateY(-2px);
}
.drop-zone .icon { font-size: 3rem; margin-bottom: 16px; }
.drop-zone h2 { font-size: 1.2rem; color: var(--purple-dark); margin-bottom: 8px; }
.drop-zone p  { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 20px; }

.btn-upload {
  background: var(--purple);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 10px 28px;
  font-family: 'Heebo', sans-serif;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
}
.btn-upload:hover { background: var(--purple-dark); transform: translateY(-1px); }

#file-input { display: none; }

/* ── TOOLBAR ── */
#toolbar {
  display: none;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 12px 32px;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.file-info {
  display: flex; align-items: center; gap: 8px;
  font-size: 0.88rem; color: var(--text-muted);
}
.file-badge {
  background: var(--purple-light);
  color: var(--purple-dark);
  border-radius: 20px;
  padding: 3px 12px;
  font-weight: 600;
  font-size: 0.82rem;
}
.btn-new {
  margin-right: auto;
  background: transparent;
  border: 1.5px solid var(--purple);
  color: var(--purple);
  border-radius: 8px;
  padding: 6px 18px;
  font-family: 'Heebo', sans-serif;
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-new:hover { background: var(--purple); color: #fff; }

.stats { display: flex; gap: 10px; font-size: 0.82rem; }
.stat-pill {
  background: var(--purple-light);
  color: var(--purple-dark);
  border-radius: 20px;
  padding: 3px 12px;
  font-weight: 500;
}

/* ── QUESTIONS ── */
#questions-section {
  display: none;
  max-width: 760px;
  margin: 0 auto;
  padding: 32px 20px 60px;
}

.topic-banner {
  background: linear-gradient(135deg, var(--purple-dark), var(--purple));
  color: #fff;
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 28px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: var(--shadow);
}
.topic-banner h2 { font-size: 1.15rem; font-weight: 700; }
.topic-banner .level-badge {
  background: rgba(255,255,255,0.2);
  border-radius: 20px;
  padding: 4px 14px;
  font-size: 0.85rem;
  font-weight: 600;
}

.question-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 22px;
  overflow: hidden;
  border-right: 5px solid var(--purple);
  animation: slideIn 0.3s ease both;
}
@keyframes slideIn {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

.card-header {
  background: var(--purple-light);
  padding: 10px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.q-number { font-weight: 700; color: var(--purple-dark); font-size: 0.9rem; }
.q-topic {
  background: var(--purple);
  color: #fff;
  border-radius: 20px;
  padding: 2px 14px;
  font-size: 0.8rem;
  font-weight: 500;
}

.card-body { padding: 18px 20px; }

.q-text {
  font-size: 1.05rem;
  font-weight: 600;
  margin-bottom: 14px;
  line-height: 1.5;
}

.code-block {
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 16px;
  font-family: 'Courier New', monospace;
  font-size: 0.88rem;
  direction: ltr;
  text-align: left;
  margin-bottom: 16px;
  color: var(--purple-dark);
  white-space: pre;
  overflow-x: auto;
  line-height: 1.6;
}

.options { list-style: none; margin-bottom: 16px; }
.options li {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 14px;
  border-radius: 9px;
  margin-bottom: 7px;
  border: 1.5px solid var(--border);
  font-size: 0.93rem;
  transition: all 0.15s;
}
.options li.correct {
  background: var(--green-light);
  border-color: var(--green);
  font-weight: 600;
  color: #1a5e35;
}
.options li.wrong { background: #fafbff; color: #555; }

.opt-label {
  font-weight: 700;
  color: var(--purple);
  min-width: 24px;
  flex-shrink: 0;
  font-size: 0.88rem;
}
.correct .opt-label { color: var(--green); }

.opt-text { flex: 1; }
.opt-text.is-code {
  direction: ltr;
  text-align: left;
  font-family: 'Courier New', monospace;
  font-size: 0.85rem;
}

.correct-badge {
  margin-right: auto;
  background: var(--green);
  color: #fff;
  border-radius: 12px;
  padding: 2px 10px;
  font-size: 0.76rem;
  font-weight: 600;
  white-space: nowrap;
}

/* ── EXPLANATION ── */
.explanation {
  background: var(--purple-light);
  border-radius: 10px;
  padding: 14px 16px;
  margin-top: 4px;
}
.exp-title {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--purple-dark);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.exp-he {
  font-size: 0.9rem;
  color: #333;
  line-height: 1.65;
  margin-bottom: 8px;
}
.exp-code {
  background: #fff;
  border: 1px solid #c5c2f0;
  border-radius: 7px;
  padding: 10px 14px;
  font-family: 'Courier New', monospace;
  font-size: 0.84rem;
  direction: ltr;
  text-align: left;
  color: var(--purple-dark);
  white-space: pre;
  overflow-x: auto;
  line-height: 1.6;
}

/* ── EXTENDED FORMAT (v2) ── */
.q-type-badge {
  background: #fff;
  color: var(--purple-dark);
  border: 1px solid var(--purple);
  border-radius: 12px;
  padding: 1px 10px;
  font-size: 0.72rem;
  font-weight: 600;
  margin-inline-start: 8px;
}

.output-block {
  background: #fff;
  border: 1.5px dashed var(--purple);
  border-radius: 8px;
  padding: 12px 16px;
  font-family: 'Courier New', monospace;
  font-size: 0.88rem;
  direction: ltr;
  text-align: left;
  margin-bottom: 14px;
  color: var(--purple-dark);
  white-space: pre;
  overflow-x: auto;
  line-height: 1.6;
  tab-size: 6;
}
.output-label {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--purple-dark);
  margin-bottom: 6px;
}

.gap-answer {
  background: var(--green-light);
  border: 1.5px solid var(--green);
  border-radius: 6px;
  padding: 0 6px;
  color: #1a5e35;
  font-weight: 700;
}

.gaps-table {
  margin-bottom: 16px;
  font-size: 0.86rem;
}
.gaps-table .gap-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 6px;
  direction: ltr;
  text-align: left;
  font-family: 'Courier New', monospace;
}
.gap-row .gap-id {
  font-weight: 700;
  color: var(--purple);
  min-width: 34px;
}
.gap-row .gap-opt {
  padding: 1px 10px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: #fafbff;
}
.gap-row .gap-opt.correct-opt {
  background: var(--green-light);
  border-color: var(--green);
  color: #1a5e35;
  font-weight: 700;
}

/* ── ERROR ── */
.error-box {
  background: #fce8e8;
  border: 1.5px solid var(--red);
  border-radius: 10px;
  padding: 16px 20px;
  color: var(--red);
  font-size: 0.9rem;
  margin: 20px 0;
  display: none;
}

/* ── FOOTER ── */
.summary-bar {
  text-align: center;
  color: var(--text-muted);
  font-size: 0.82rem;
  margin-top: 32px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}
</style>
</head>
<body>

<div class="app-header">
  <div class="logo">👁</div>
  <div>
    <h1>כלי תצוגה מקדימה — שאלות JSON</h1>
    <p>העלה קובץ JSON כדי לראות את השאלות לפני תרגום ויצירת השאלון</p>
  </div>
</div>

<!-- DROP ZONE -->
<div id="drop-section">
  <div class="drop-zone" id="drop-zone">
    <div class="icon">📂</div>
    <h2>גרור קובץ JSON לכאן</h2>
    <p>או לחץ לבחירת קובץ מהמחשב</p>
    <button class="btn-upload" onclick="document.getElementById('file-input').click()">
      בחר קובץ JSON
    </button>
    <input type="file" id="file-input" accept=".json">
  </div>
  <div class="error-box" id="error-box"></div>
</div>

<!-- TOOLBAR -->
<div id="toolbar">
  <div class="file-info">
    <span>📄</span>
    <span id="file-name-display"></span>
    <span class="file-badge" id="level-badge"></span>
  </div>
  <div class="stats">
    <span class="stat-pill" id="q-count-badge"></span>
    <span class="stat-pill" id="topic-badge"></span>
  </div>
  <button class="btn-new" onclick="resetTool()">⟵ קובץ אחר</button>
</div>

<!-- QUESTIONS -->
<div id="questions-section">
  <div class="topic-banner" id="topic-banner">
    <h2 id="banner-title"></h2>
    <span class="level-badge" id="banner-level"></span>
  </div>
  <div id="questions-container"></div>
  <div class="summary-bar">
    * כלי זה לבדיקה בלבד — התשובה הנכונה מוצגת תמיד
  </div>
</div>

<script>
const LABELS = ['א', 'ב', 'ג', 'ד', 'ה'];

function isCodeOption(opt) {
  const clean = (opt || '').replace(/\u200f/g, '').trim();
  return clean.includes(';') ||
         clean.startsWith('{') ||
         clean.startsWith('[') ||
         /^-?\d+$/.test(clean) === false && /^[a-zA-Z]/.test(clean);
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

/* ── multichoice ── */
function renderMultichoicePreview(q) {
  const optionsHtml = (q.options || []).map((opt, i) => {
    const isCorrect = i === (q.answer ?? 0);
    let codeOpt, cleanOpt;

    if (typeof opt === 'object' && opt !== null && opt.type === 'code') {
      codeOpt  = true;
      cleanOpt = escapeHtml(opt.text || '').replace(/\n/g, '<br>');
    } else {
      const text = typeof opt === 'string' ? opt : String(opt ?? '');
      codeOpt   = isCodeOption(text);
      cleanOpt  = escapeHtml(text.replace(/\u200f/g, ''));
    }
    return `
      <li class="${isCorrect ? 'correct' : 'wrong'}">
        <span class="opt-label">${LABELS[i]}.</span>
        <span class="opt-text${codeOpt ? ' is-code' : ''}"
              ${codeOpt ? 'dir="ltr"' : ''}>${cleanOpt}</span>
        ${isCorrect ? '<span class="correct-badge">✓ נכון</span>' : ''}
      </li>`;
  }).join('');
  return `<ul class="options">${optionsHtml}</ul>`;
}

/* ── gapselect: קוד עם התשובות הנכונות מסומנות + טבלת אפשרויות ── */
function renderGapselectPreview(q) {
  const gapMap = {};
  (q.gaps || []).forEach(g => { gapMap[g.id] = g; });

  const codeHtml = (q.codeLines || []).map(line => {
    const replaced = escapeHtml(line).replace(/\[\[(\d+)\]\]/g, (_, id) => {
      const gap = gapMap[parseInt(id)];
      return gap
        ? `<span class="gap-answer">${escapeHtml(gap.answer)}</span>`
        : `[[${id}]]`;
    });
    return replaced;
  }).join('\n');

  const gapsTable = (q.gaps || []).map(g => {
    const opts = g.options.map(o =>
      `<span class="gap-opt${o === g.answer ? ' correct-opt' : ''}">${escapeHtml(o)}</span>`
    ).join(' ');
    return `<div class="gap-row"><span class="gap-id">[${g.id}]</span> ${opts}</div>`;
  }).join('');

  return `
    <div class="code-block">${codeHtml}</div>
    <div class="gaps-table">${gapsTable}</div>`;
}

/* ── cloze: קוד עם התשובות מסומנות + אפשרויות לכל חור ── */
function renderClozePreview(q) {
  const codeHtml = (q.codeLines || []).map(line => {
    if (!line.blank) {
      return escapeHtml(line.before || '') + escapeHtml(line.after || '');
    }
    return escapeHtml(line.before || '') +
      `<span class="gap-answer">${escapeHtml(line.blank.answer)}</span>` +
      escapeHtml(line.after || '');
  }).join('\n');

  const blanks = (q.codeLines || []).filter(l => l.blank);
  const gapsTable = blanks.map((l, i) => {
    const opts = l.blank.options.map(o =>
      `<span class="gap-opt${o === l.blank.answer ? ' correct-opt' : ''}">${escapeHtml(o)}</span>`
    ).join(' ');
    return `<div class="gap-row"><span class="gap-id">[${i + 1}]</span> ${opts}</div>`;
  }).join('');

  return `
    <div class="code-block">${codeHtml}</div>
    <div class="gaps-table">${gapsTable}</div>`;
}

function renderQuestions(data) {
  const questions = data.questionsHe || data.questionsAr || data.questions || (Array.isArray(data) ? data : null);
  if (!questions || !questions.length) throw new Error('לא נמצאו שאלות בקובץ');

  // Banner
  document.getElementById('banner-title').textContent = data.topic || 'שאלות';
  document.getElementById('banner-level').textContent = data.level ? `רמה ${data.level}` : '';

  // Toolbar
  document.getElementById('level-badge').textContent  = data.level ? `רמה ${data.level}` : '';
  document.getElementById('q-count-badge').textContent = `${questions.length} שאלות`;
  document.getElementById('topic-badge').textContent   = data.topic || '';

  const container = document.getElementById('questions-container');
  container.innerHTML = '';

  questions.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.style.animationDelay = `${idx * 0.04}s`;

    const qType = q.type || 'multichoice';

    /* גוף השאלה לפי סוג */
    let bodyHtml = '';
    if (qType === 'gapselect')     bodyHtml = renderGapselectPreview(q);
    else if (qType === 'cloze')    bodyHtml = renderClozePreview(q);
    else                           bodyHtml = renderMultichoicePreview(q);

    /* בלוק פלט רצוי (אם קיים) */
    const outputHtml = q.output ? `
      <div class="output-label">פלט רצוי:</div>
      <div class="output-block">${escapeHtml(q.output)}</div>` : '';

    /* טקסט המשך (אם קיים) */
    const text2Html = q.text2 ? `<div class="q-text">${escapeHtml(q.text2)}</div>` : '';

    const explanationHtml = (q.explanation || []).map(block => {
      if (block.type === 'code')
        return `<div class="exp-code">${escapeHtml(block.text)}</div>`;
      return `<div class="exp-he">${escapeHtml(block.text)}</div>`;
    }).join('');

    card.innerHTML = `
      <div class="card-header">
        <span class="q-number">שאלה ${idx + 1} מתוך ${questions.length}
          <span class="q-type-badge">${qType}</span>
        </span>
        <span class="q-topic">${escapeHtml(q.topic || '')}</span>
      </div>
      <div class="card-body">
        <div class="q-text">${escapeHtml(q.text || '')}</div>
        ${outputHtml}
        ${text2Html}
        ${q.code ? `<div class="code-block">${escapeHtml(q.code)}</div>` : ''}
        ${bodyHtml}
        ${explanationHtml ? `
          <div class="explanation">
            <div class="exp-title">💡 הסבר</div>
            ${explanationHtml}
          </div>` : ''}
      </div>`;

    container.appendChild(card);
  });

  // Show sections
  document.getElementById('drop-section').style.display   = 'none';
  document.getElementById('toolbar').style.display        = 'flex';
  document.getElementById('questions-section').style.display = 'block';
}

function loadFile(file) {
  if (!file || !file.name.endsWith('.json')) {
    showError('יש לבחור קובץ בפורמט JSON (.json)');
    return;
  }
  document.getElementById('file-name-display').textContent = file.name;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      hideError();
      renderQuestions(data);
    } catch(err) {
      showError('שגיאה בקריאת הקובץ: ' + err.message);
    }
  };
  reader.readAsText(file, 'utf-8');
}

function showError(msg) {
  const box = document.getElementById('error-box');
  box.textContent = '⚠️ ' + msg;
  box.style.display = 'block';
}
function hideError() {
  document.getElementById('error-box').style.display = 'none';
}

function resetTool() {
  document.getElementById('drop-section').style.display      = 'block';
  document.getElementById('toolbar').style.display           = 'none';
  document.getElementById('questions-section').style.display = 'none';
  document.getElementById('file-input').value = '';
  hideError();
}

// File input
document.getElementById('file-input').addEventListener('change', e => {
  loadFile(e.target.files[0]);
});

// Drag & Drop
const dropZone = document.getElementById('drop-zone');
dropZone.addEventListener('click', () => document.getElementById('file-input').click());
dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  loadFile(e.dataTransfer.files[0]);
});
</script>
</body>
</html>
