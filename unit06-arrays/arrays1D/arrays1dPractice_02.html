  <title>תרגול לולאת for ב-Java — רמה 02</title>

  <style>

    :root {

      color: var(--color-dark);

      text-align: left;

      font-size: 13px;
      padding: 1px 0;

      background: #f8f8f8;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 12px 14px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      margin-bottom: 14px;
      white-space: pre;
      overflow-x: auto;
      line-height: 1.7;
      direction: ltr;
      text-align: left;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .opt {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      background: transparent;
      width: 100%;
      direction: ltr;
      text-align: left;
      font-family: 'Courier New', monospace;
      color: #1a1a1a;
      transition: background 0.15s;
    }

    .opt:hover:not(.disabled) { background: #f8f8f8; }
    .opt.correct { background: #EAF3DE; border-color: #3B6D11; color: #27500A; }
    .opt.wrong   { background: #FCEBEB; border-color: #A32D2D; color: #791F1F; }
    .opt.disabled { pointer-events: none; }

    .opt-letter {
      font-size: 12px;
      font-weight: 500;
      min-width: 22px;
      color: #aaa;
      font-family: 'Segoe UI', Arial, sans-serif;

    .opt-text-he {
      direction: rtl;
      text-align: right;
      flex: 1;
      unicode-bidi: embed;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    .opt-code {
      background-color: #f5f5f5;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .explanation {
      display: none;
      margin-top: 12px;
      padding: 10px 14px;
      font-size: 13px;
      color: #555;
      line-height: 2;
      border-right: 3px solid var(--color-main);
      background: #f8f8f8;
      direction: rtl;
      text-align: right;
    }

    .explanation.show { display: block; }

    .exp-line {
      display: block;
      direction: rtl;
      text-align: right;
    }

    .exp-code {
      display: block;
      direction: ltr;
      text-align: left;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      background: #fff;
      padding: 3px 8px;
      border-radius: 4px;
      margin: 2px 0;
    }

    .next-btn {
      display: none;
      margin-top: 1rem;
      padding: 10px 22px;
      border: 1px solid var(--color-main);
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      font-size: 14px;
      color: var(--color-dark);
      font-family: inherit;
    }

    .next-btn:hover { background: var(--color-light); }
    .next-btn.show  { display: inline-block; }

    .score-box {
      text-align: center;
      padding: 3rem 1rem;
    }

    .score-num {
      font-size: 56px;
      font-weight: 500;
      color: #1a1a1a;
    }

    .score-label {
      font-size: 16px;
      color: #666;
      margin-top: 8px;
    }

    .score-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }

    .restart-btn {
      padding: 10px 28px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      color: #1a1a1a;
    }

    .restart-btn:hover { background: #f5f5f5; }

    .home-return-btn {
      padding: 10px 28px;
      border: 1px solid var(--color-main);
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      color: var(--color-dark);
    }

    .home-return-btn:hover { background: var(--color-light); }

  <div class="container">

    <!-- מסך פתיחה -->

  <script>

    /* ══════════════════════════════════════════════════════════════
       הכנס כאן את שאלות העברית
       כל שאלה במבנה הבא:
       {
         topic: "נושא השאלה",
         textParts: [
           { type: "he",   text: "טקסט עברי" },
           { type: "code", text: "קוד" },
           { type: "he",   text: "המשך טקסט" }
         ],
         code: `קוד Java`,
         options: ["תשובה א", "תשובה ב", "תשובה ג", "תשובה ד"],
         answer: 0,
         explanation: [
           { type: "he",   text: "הסבר" },
           { type: "code", text: "קוד" }
         ]
       }
    ══════════════════════════════════════════════════════════════ */
    const questionsHe = [
  {
    "topic": "לולאה עם תנאי",
    "text": "מה יהיה תוכן המערך a לאחר הרצת הקוד הבא?",
    "code": "int[] a = new int[6];\nfor (int i = 0; i < 6; i++) {\n    if (i % 2 == 0)\n        a[i] = i + 1;\n}",
    "options": [
      "{1, 0, 3, 0, 5, 0}",
      "{0, 1, 0, 3, 0, 5}",
      "{1, 2, 3, 4, 5, 6}",
      "{0, 0, 3, 0, 5, 0}"
    ],
    "answer": 0,
    "explanation": [
      {
        "type": "he",
        "text": "התנאי i%2==0 מתקיים רק עבור אינדקסים זוגיים (0, 2, 4). לתאים אלו נשמר הערך i+1. שאר התאים נשארים עם ערך ברירת המחדל 0."
      },
      {
        "type": "code",
        "text": "i=0: a[0] = 0+1 = 1\ni=2: a[2] = 2+1 = 3\ni=4: a[4] = 4+1 = 5\n// תוצאה: {1, 0, 3, 0, 5, 0}"
      }
    ],
    "textParts": [
      {
        "type": "he",
        "text": "מה יהיה תוכן המערך a לאחר הרצת הקוד הבא?"
      }
    ]
  },
  {
    "topic": "עקיבה — סכום מסוים",
    "text": "מה יודפס?",
    "code": "public static void main(String[] args) {\n    int[] arr = {3, 7, 2, 9, 4};\n    System.out.println(sumAbove(arr, 4));\n}\n\npublic static int sumAbove(int[] arr, int x) {\n    int sum = 0;\n    for (int i = 0; i < arr.length; i++)\n        if (arr[i] > x)\n            sum += arr[i];\n    return sum;\n}",
    "options": [
      "16",
      "25",
      "20",
      "9"
    ],
    "answer": 0,
    "explanation": [
      {
        "type": "he",
        "text": "השיטה מחברת רק איברים הגדולים מ-4 (בהחלט — לא כולל שווה). מהמערך: 7 ו-9 בלבד עומדים בתנאי."
      },
      {
        "type": "code",
        "text": "3>4? לא\n7>4? כן → sum=7\n2>4? לא\n9>4? כן → sum=16\n4>4? לא\n// תוצאה: 16"
      }
    ],
    "textParts": [
      {
        "type": "he",
        "text": "מה יודפס?"
      }
    ]
  },
  {
    "topic": "מציאת מקסימום",
    "text": "מה יודפס?",
    "code": "int[] arr = {4, 7, 2, 9, 3};\nint max = arr[0];\nfor (int i = 1; i < arr.length; i++) {\n    if (arr[i] > max)\n        max = arr[i];\n}\nSystem.out.println(max);",
    "options": [
      "9",
      "7",
      "4",
      "3"
    ],
    "answer": 0,
    "explanation": [
      {
        "type": "he",
        "text": "האלגוריתם מתחיל עם max=arr[0]=4 ועובר על שאר האיברים. בכל פעם שמוצא איבר גדול יותר, מעדכן את max."
      },
      {
        "type": "code",
        "text": "max=4\n7>4 → max=7\n2<7\n9>7 → max=9\n3<9\n// תוצאה: 9"
      }
    ],
    "textParts": [
      {
        "type": "he",
        "text": "מה יודפס?"
      }
    ]
  },
  {
    "topic": "שינוי מערך — סכום עם שכן",
    "text": "מה יהיה תוכן המערך a לאחר הרצת הקוד הבא?",
    "code": "int[] a = {1, 2, 3, 4, 5};\nfor (int i = 0; i < a.length - 1; i++) {\n    a[i] = a[i] + a[i + 1];\n}",
    "options": [
      "{3, 5, 7, 9, 5}",
      "{3, 5, 7, 9, 9}",
      "{1, 3, 5, 7, 9}",
      "{2, 4, 6, 8, 5}"
    ],
    "answer": 0,
    "explanation": [
      {
        "type": "he",
        "text": "בכל שלב a[i] מתעדכן לסכום עם שכנו הימני. חשוב: a[i+1] עדיין שומר את ערכו המקורי כשמחשבים a[i], ולכן כל חישוב משתמש בערך שכבר עודכן."
      },
      {
        "type": "code",
        "text": "i=0: a[0]=1+2=3  → {3,2,3,4,5}\ni=1: a[1]=2+3=5  → {3,5,3,4,5}\ni=2: a[2]=3+4=7  → {3,5,7,4,5}\ni=3: a[3]=4+5=9  → {3,5,7,9,5}"
      }
    ],
    "textParts": [
      {
        "type": "he",
        "text": "מה יהיה תוכן המערך a לאחר הרצת הקוד הבא?"
      }
    ]
  },
  {
    "topic": "ספירה מעל ממוצע",
    "text": "מה יודפס?",
    "code": "int[] arr = {2, 8, 4, 6, 10};\ndouble avg = 6.0;\nint count = 0;\nfor (int i = 0; i < arr.length; i++)\n    if (arr[i] > avg)\n        count++;\nSystem.out.println(count);",
    "options": [
      "2",
      "3",
      "1",
      "4"
    ],
    "answer": 0,
    "explanation": [
      {
        "type": "he",
        "text": "הממוצע הוא 6.0. הקוד סופר איברים הגדולים ממש מ-6.0. האיברים 8 ו-10 עומדים בתנאי, אך 6 לא (כי 6>6.0 הוא שקר)."
      },
      {
        "type": "code",
        "text": "2>6.0? לא\n8>6.0? כן → count=1\n4>6.0? לא\n6>6.0? לא\n10>6.0? כן → count=2\n// תוצאה: 2"
      }
    ],
    "textParts": [
      {
        "type": "he",
        "text": "מה יודפס?"
      }
    ]
  },
  {
    "topic": "שינוי ערכי מערך",
    "text": "מה יהיה תוכן המערך a לאחר הרצת הקוד הבא?",
    "code": "int[] a = {5, 3, 8, 1, 9};\nfor (int i = 0; i < a.length; i++) {\n    a[i] = 10 - a[i];\n}",
    "options": [
      "{5, 7, 2, 9, 1}",
      "{5, 3, 8, 1, 9}",
      "{-5, -3, -8, -1, -9}",
      "{7, 5, 2, 9, 1}"
    ],
    "answer": 0,
    "explanation": [
      {
        "type": "he",
        "text": "כל איבר מוחלף בהפרש שלו מ-10."
      },

    /* ══════════════════════════════════════════════════════════════
       לוגיקה — אין צורך לשנות כלום מכאן והלאה
    ══════════════════════════════════════════════════════════════ */

    function shuffleOptions(questions) {
      return questions.map(q => {
        const indices = q.options.map((_, i) => i);
        for (let i = indices.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [indices[i], indices[j]] = [indices[j], indices[i]];
        }
        const newOptions = indices.map(i => q.options[i]);
        const newAnswer  = indices.indexOf(q.answer);
        return { ...q, options: newOptions, answer: newAnswer };
      });
    }

    let shuffledHe = [];
    let shuffledAr = [];

    const state = { he: { current: 0, score: 0 }, ar: { current: 0, score: 0 } };

    const ui = {
      he: {
        next: (c, t) => c === t - 1 ? 'סיום וראה ציון' : 'לשאלה הבאה',
        scoreLabel: s => s >= 8 ? 'מצוין!' : s >= 6 ? 'טוב מאוד!' : s >= 4 ? 'לא רע, כדאי לחזור על החומר' : 'כדאי לחזור על לולאות for',
        restart: 'התחל מחדש',
        home: 'חזור לתפריט',
        qOf: (c, t) => `שאלה ${c} מתוך ${t}`
      },
      ar: {
        next: (c, t) => c === t - 1 ? 'إنهاء وعرض النتيجة' : 'السؤال التالي',
        scoreLabel: s => s >= 8 ? 'ممتاز!' : s >= 6 ? 'جيد جداً!' : s >= 4 ? 'لا بأس، يُنصح بمراجعة المادة' : 'يُنصح بمراجعة حلقات for',
        restart: 'ابدأ من جديد',
        home: 'العودة للقائمة',
        qOf: (c, t) => `سؤال ${c} من ${t}`
      }
    };

    function buildExplanation(lines) {
      return lines.map(l =>
        l.type === 'code'
          ? `<span class="exp-code">${l.text.replace(/\n/g, '<br>')}</span>`
          : `<span class="exp-line">${l.text}</span>`
      ).join('');
    }

    function buildQuestionText(parts) {
      return parts.map(p =>
        p.type === 'code'
          ? `<span class="q-text-code">${p.text}</span>`
          : `<span class="q-text-line">${p.text}</span>`
      ).join('');
    }

    function buildOption(option) {
      if (typeof option === 'object' && option.type === 'code') {
        return `<span class="opt-code">${option.text}</span>`;
      }
      const text = typeof option === 'string' ? option : String(option);
      // זיהוי טקסט עברי — מתחיל בתו עברי (לאחר הסרת ‏)
      const clean = text.replace(/‏/g, '').trim();
      const isHebrew = /^[֐-׿יִ-ﭏ]/.test(clean);
      if (isHebrew) {
        return `<span class="opt-text-he">${text}</span>`;
      }
      // קוד / אנגלית — נשאר LTR
      return `<span class="opt-code" style="background:none;padding:0;">${text}</span>`;
    }

    function render(lang) {
      const questions = lang === 'he' ? shuffledHe : shuffledAr;
      const s = state[lang], t = ui[lang], total = questions.length;
      const app = document.getElementById(`app-${lang}`);

      if (s.current >= total) {
        app.innerHTML = `<div class="score-box">
          <div class="score-num">${s.score}/${total}</div>
          <div class="score-label">${t.scoreLabel(s.score)}</div>
          <div class="score-actions">
            <button class="restart-btn" onclick="restartQuiz('${lang}')">${t.restart}</button>
            <button class="home-return-btn" onclick="goHome()">${t.home}</button>
          </div>
        </div>`;
        return;
      }

      const q = questions[s.current];
      const letters = ['A', 'B', 'C', 'D'];
      const pct = (s.current / total * 100).toFixed(0);

      app.innerHTML = `
        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
        <div class="q-card">
          <div class="q-meta">
            <span class="q-num-badge">${t.qOf(s.current + 1, total)}</span>
            <span class="q-topic">${q.topic}</span>
          </div>
          <div class="q-text">${buildQuestionText(q.textParts)}</div>
          <div class="code-block">${q.code}</div>
          <div class="options" id="opts-${lang}">
            ${q.options.map((o, i) => `<button class="opt" onclick="choose('${lang}',${i})"><span class="opt-letter">${letters[i]}.</span>${buildOption(o)}</button>`).join('')}
          </div>
          <div class="explanation" id="exp-${lang}">${buildExplanation(q.explanation)}</div>
          <button class="next-btn" id="nxt-${lang}" onclick="nextQ('${lang}')">${t.next(s.current, total)}</button>
        </div>`;
    }

    function choose(lang, idx) {
      const questions = lang === 'he' ? shuffledHe : shuffledAr;
      const q = questions[state[lang].current];
      const opts = document.querySelectorAll(`#opts-${lang} .opt`);
      opts.forEach(o => o.classList.add('disabled'));
      opts[idx].classList.add(idx === q.answer ? 'correct' : 'wrong');
      if (idx !== q.answer) opts[q.answer].classList.add('correct');
      document.getElementById(`exp-${lang}`).classList.add('show');
      document.getElementById(`nxt-${lang}`).classList.add('show');
      if (idx === q.answer) state[lang].score++;
    }

    function nextQ(lang) { state[lang].current++; render(lang); }

    function restartQuiz(lang) {
      state[lang] = { current: 0, score: 0 };
      if (lang === 'he') shuffledHe = shuffleOptions(questionsHe);
      else               shuffledAr = shuffleOptions(questionsAr);
      render(lang);
    }

    function startQuiz(lang) {
      if (lang === 'he') shuffledHe = shuffleOptions(questionsHe);
      else               shuffledAr = shuffleOptions(questionsAr);
      state[lang] = { current: 0, score: 0 };
      document.getElementById('screen-home').style.display = 'none';
      document.getElementById(`screen-${lang}`).style.display = 'block';
      render(lang);
    }

    function goHome() {
      document.getElementById('screen-he').style.display = 'none';
      document.getElementById('screen-ar').style.display = 'none';
      document.getElementById('screen-home').style.display = 'flex';
    }

  </script>
</body>

</html>
