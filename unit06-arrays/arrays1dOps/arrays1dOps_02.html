    .exp-line {

    .exp-code {
      display: block;

    .next-btn {

    .score-actions {

      font-size: 14px;
      font-family: inherit;
      color: var(--color-dark);

    .home-return-btn:hover { background: var(--color-light); }

  <script>

    /* ══════════════════════════════════════════════════════════════
       הכנס כאן את שאלות העברית

       {
         topic: "נושא השאלה",
         textParts: [
           { type: "he",   text: "טקסט עברי" },
           { type: "code", text: "קוד" },
           { type: "he",   text: "המשך טקסט" }
         ],
         code: `קוד Java`,
         options: ["תשובה א", "תשובה ב", "תשובה ג", "תשובה ד"],

         explanation: [

       }
    ══════════════════════════════════════════════════════════════ */
    const questionsHe = [
  {
    "topic": "הדפסה בשורות",
    "text": "מה תהיה הדפסת השורה הראשונה?",
    "code": "int[] a = {10, 20, 30, 40, 50, 60};\nfor (int i = 0; i < a.length; i++) {\n    System.out.print(a[i]);\n    if ((i + 1) % 3 == 0)\n        System.out.println();\n    else\n        System.out.print(\"-\");\n}",
    "options": [
      "10-20-30",
      "10-20-30-40-50-60",
      "10",
      "10-20-30-"
    ],
    "answer": 0,
    "explanation": [
      {
        "type": "he",
        "text": "בכל פעם ש-(i+1) מתחלק ב-3 מודפסת ירידת שורה. ב-i=0,1 מודפס \"-\" לאחר הספרה, ב-i=2 מודפסת ירידת שורה. השורה הראשונה היא 10-20-30."
      },
      {
        "type": "code",
        "text": "i=0: \"10\" + \"-\"\ni=1: \"20\" + \"-\"\ni=2: \"30\" + println()\n// שורה ראשונה: 10-20-30"
      }
    ],
    "textParts": [
      {
        "type": "he",
        "text": "מה תהיה הדפסת השורה הראשונה?"
      }
    ]
  },
  {
    "topic": "עקיבה — כפילויות",
    "text": "מה יודפס?",
    "code": "public static int foo(int[] a) {\n    int maxIndex = 0;\n    for (int i = 1; i < a.length; i++) {\n        if (a[i] > a[maxIndex])\n            maxIndex = i;\n    }\n    return maxIndex;\n}\n// בתוכנית הראשית:\nint[] arr = {5, 9, 3, 9, 1};\nSystem.out.println(foo(arr));",
    "options": [
      "1",
      "3",
      "9",
      "4"
    ],
    "answer": 0,
    "explanation": [
      {
        "type": "he",
        "text": "המשתנה maxIndex שומר את אינדקס הערך הגדול שנמצא עד כה. הערך 9 מופיע פעמיים (אינדקסים 1 ו-3). התנאי a[i] > a[maxIndex] (קשיח, לא >=) מעדכן רק כשמוצא ערך גדול בהחלט — לכן נשמר האינדקס הראשון."
      },
      {
        "type": "code",
        "text": "maxIndex=0\ni=1: 9>5 → maxIndex=1\ni=2: 3>9? לא\ni=3: 9>9? לא (לא >)\ni=4: 1>9? לא\n// return 1"
      }
    ],
    "textParts": [
      {
        "type": "he",
        "text": "מה יודפס?"
      }
    ]
  },
  {
    "topic": "עקיבה — חיפוש ערך",
    "text": "מה יודפס?",
    "code": "public static int foo(int[] a, int value) {\n    for (int i = 0; i < a.length; i++) {\n        if (a[i] == value)\n            return i;\n    }\n    return -1;\n}\n// בתוכנית הראשית:\nint[] arr = {3, 1, 4, 1, 5};\nSystem.out.println(foo(arr, 4));",
    "options": [
      "2",
      "3",
      "4",
      "-1"
    ],
    "answer": 0,
    "explanation": [
      {
        "type": "he",
        "text": "השיטה עוברת מאינדקס 0 ומחזירה את האינדקס הראשון בו מוצא הערך 4."
      },
      {
        "type": "code",
        "text": "i=0: 3==4? לא\ni=1: 1==4? לא\ni=2: 4==4? כן → return 2"
      }
    ],
    "textParts": [
      {
        "type": "he",
        "text": "מה יודפס?"
      }
    ]
  },
  {
    "topic": "עקיבה — החלפת ערכים",
    "text": "מה יודפס?",
    "code": "public static void foo(int[] a, int i, int j) {\n    int temp = a[i];\n    a[i] = a[j];\n    a[j] = temp;\n}\n// בתוכנית הראשית:\nint[] a = {10, 20, 30, 40, 50};\nfoo(a, 1, 3);\nSystem.out.println(a[1] + \" \" + a[3]);",
    "options": [
      "40 20",
      "20 40",
      "10 40",
      "20 20"
    ],
    "answer": 0,
    "explanation": [
      {
        "type": "he",
        "text": "השיטה שומרת את a[i] ב-temp, מכניסה את a[j] ל-a[i], ואז שמה את temp ב-a[j]. כך מתבצעת החלפה מלאה בין a[1]=20 לבין a[3]=40."
      },
      {
        "type": "code",
        "text": "temp = a[1] = 20\na[1] = a[3] = 40\na[3] = temp = 20\n// \"40 20\""
      }
    ],
    "textParts": [
      {
        "type": "he",
        "text": "מה יודפס?"
      }
    ]
  },
  {
    "topic": "עקיבה — מערך מוחזר",
    "text": "מה יודפס?",
    "code": "public static int[] foo(int[] a) {\n    int min = a[0], minIdx = 0;\n    int max = a[0], maxIdx = 0;\n    for (int i = 1; i < a.length; i++) {\n        if (a[i] < min) { min = a[i]; minIdx = i; }\n        else if (a[i] > max) { max = a[i]; maxIdx = i; }\n    }\n    return new int[]{min, minIdx, max, maxIdx};\n}\n// בתוכנית הראשית:\nint[] arr = {5, 2, 8, 1, 6};\nint[] result = foo(arr);\nSystem.out.println(result[2]);",
    "options": [
      "8",
      "2",
      "1",
      "6"
    ],
    "answer": 0,
    "explanation": [
      {
        "type": "he",
        "text": "השיטה עוברת על המערך ומחזירה מערך של 4 ערכים לפי הסדר: result[0], result[1], result[2], result[3]. כדי לדעת מה יודפס יש לעקוב אחרי מה מכיל result[2] לאחר הלולאה."
      },
      {
        "type": "code",
        "text": "result[0] = 1   // מינימום\nresult[1] = 3   // אינדקס מינימום\nresult[2] = 8   // מקסימום\nresult[3] = 2   // אינדקס מקסימום"
      }
    ],
    "textParts": [
      {
        "type": "he",
        "text": "מה יודפס?"
      }
    ]
  },
  {
    "topic": "השלמת קוד — search",
    "text": "מה יש להשלים במקום /* ??? */ כדי שהשיטה תחזיר את האינדקס של value?",
    "code": "public static int search(int[] a, int value) {\n    for (int i = 0; i < a.length; i++) {\n        if ( /* ??? */ )\n            return i;\n    }\n    return -1;\n}",
    "options": [
      "a[i] == value",
      "a[i] = value",
      "a[i] >= value",
      "i == value"
    ],

    function shuffleOptions(questions) {
      return questions.map(q => {
        const indices = q.options.map((_, i) => i);
        for (let i = indices.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [indices[i], indices[j]] = [indices[j], indices[i]];
        }
        const newOptions = indices.map(i => q.options[i]);
        const newAnswer  = indices.indexOf(q.answer);
        return { ...q, options: newOptions, answer: newAnswer };
      });
    }

    let shuffledHe = [];
    let shuffledAr = [];

    const state = { he: { current: 0, score: 0 }, ar: { current: 0, score: 0 } };

    const ui = {
      he: {
        next: (c, t) => c === t - 1 ? 'סיום וראה ציון' : 'לשאלה הבאה',
        scoreLabel: s => s >= 8 ? 'מצוין!' : s >= 6 ? 'טוב מאוד!' : s >= 4 ? 'לא רע, כדאי לחזור על החומר' : 'כדאי לחזור על לולאות for',
        restart: 'התחל מחדש',
        home: 'חזור לתפריט',
        qOf: (c, t) => `שאלה ${c} מתוך ${t}`
      },

        next: (c, t) => c === t - 1 ? 'إنهاء وعرض النتيجة' : 'السؤال التالي',
        scoreLabel: s => s >= 8 ? 'ممتاز!' : s >= 6 ? 'جيد جداً!' : s >= 4 ? 'لا بأس، يُنصح بمراجعة المادة' : 'يُنصح بمراجعة حلقات for',
        restart: 'ابدأ من جديد',
        home: 'العودة للقائمة',
        qOf: (c, t) => `سؤال ${c} من ${t}`
      }
    };

    function buildExplanation(lines) {
      return lines.map(l =>
        l.type === 'code'
          ? `<span class="exp-code">${l.text.replace(/\n/g, '<br>')}</span>`
          : `<span class="exp-line">${l.text}</span>`
      ).join('');
    }

    function buildQuestionText(parts) {
      return parts.map(p =>
        p.type === 'code'
          ? `<span class="q-text-code">${p.text}</span>`
          : `<span class="q-text-line">${p.text}</span>`
      ).join('');
    }

    function buildOption(option) {
      if (typeof option === 'object' && option.type === 'code') {
        return `<span class="opt-code">${option.text}</span>`;
      }
      const text = typeof option === 'string' ? option : String(option);
      // זיהוי טקסט עברי — מתחיל בתו עברי (לאחר הסרת ‏)
      const clean = text.replace(/‏/g, '').trim();
      const isHebrew = /^[֐-׿יִ-ﭏ]/.test(clean);
      if (isHebrew) {
        return `<span class="opt-text-he">${text}</span>`;
      }
      // קוד / אנגלית — נשאר LTR
      return `<span class="opt-code" style="background:none;padding:0;">${text}</span>`;
    }

    function render(lang) {
      const questions = lang === 'he' ? shuffledHe : shuffledAr;
      const s = state[lang], t = ui[lang], total = questions.length;
      const app = document.getElementById(`app-${lang}`);

      if (s.current >= total) {
        app.innerHTML = `<div class="score-box">
          <div class="score-num">${s.score}/${total}</div>
          <div class="score-label">${t.scoreLabel(s.score)}</div>
          <div class="score-actions">
            <button class="restart-btn" onclick="restartQuiz('${lang}')">${t.restart}</button>
            <button class="home-return-btn" onclick="goHome()">${t.home}</button>
          </div>
        </div>`;
        return;
      }

      const q = questions[s.current];
      const letters = ['A', 'B', 'C', 'D'];
      const pct = (s.current / total * 100).toFixed(0);

      app.innerHTML = `
        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
        <div class="q-card">
          <div class="q-meta">
            <span class="q-num-badge">${t.qOf(s.current + 1, total)}</span>
            <span class="q-topic">${q.topic}</span>
          </div>
          <div class="q-text">${buildQuestionText(q.textParts)}</div>
          <div class="code-block">${q.code}</div>
          <div class="options" id="opts-${lang}">
            ${q.options.map((o, i) => `<button class="opt" onclick="choose('${lang}',${i})"><span class="opt-letter">${letters[i]}.</span>${buildOption(o)}</button>`).join('')}
          </div>
          <div class="explanation" id="exp-${lang}">${buildExplanation(q.explanation)}</div>
          <button class="next-btn" id="nxt-${lang}" onclick="nextQ('${lang}')">${t.next(s.current, total)}</button>
        </div>`;
    }

    function choose(lang, idx) {
      const questions = lang === 'he' ? shuffledHe : shuffledAr;
      const q = questions[state[lang].current];
      const opts = document.querySelectorAll(`#opts-${lang} .opt`);
      opts.forEach(o => o.classList.add('disabled'));
      opts[idx].classList.add(idx === q.answer ? 'correct' : 'wrong');
      if (idx !== q.answer) opts[q.answer].classList.add('correct');
      document.getElementById(`exp-${lang}`).classList.add('show');
      document.getElementById(`nxt-${lang}`).classList.add('show');
      if (idx === q.answer) state[lang].score++;
    }

    function nextQ(lang) { state[lang].current++; render(lang); }

    function restartQuiz(lang) {
      state[lang] = { current: 0, score: 0 };
      if (lang === 'he') shuffledHe = shuffleOptions(questionsHe);
      else               shuffledAr = shuffleOptions(questionsAr);
      render(lang);
    }

    function startQuiz(lang) {
      if (lang === 'he') shuffledHe = shuffleOptions(questionsHe);
      else               shuffledAr = shuffleOptions(questionsAr);
      state[lang] = { current: 0, score: 0 };
      document.getElementById('screen-home').style.display = 'none';
      document.getElementById(`screen-${lang}`).style.display = 'block';
      render(lang);
    }

    function goHome() {
      document.getElementById('screen-he').style.display = 'none';
      document.getElementById('screen-ar').style.display = 'none';
      document.getElementById('screen-home').style.display = 'flex';
    }

  </script>
</body>

</html>
