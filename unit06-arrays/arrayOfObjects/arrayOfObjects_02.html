  <style>

    :root {

      padding: 3px 10px;

      font-size: 15px;
      margin-bottom: 12px;
      line-height: 1.8;

      display: block;
      direction: rtl;
      text-align: right;
    }

    .q-text-code {

      direction: ltr;
      text-align: left;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      padding: 1px 0;

    .code-block {
      background: #f8f8f8;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 12px 14px;

      font-size: 13px;
      margin-bottom: 14px;
      white-space: pre;
      overflow-x: auto;
      line-height: 1.7;
      direction: ltr;
      text-align: left;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .opt {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      background: transparent;
      width: 100%;
      direction: ltr;
      text-align: left;
      font-family: 'Courier New', monospace;
      color: #1a1a1a;
      transition: background 0.15s;

    .opt:hover:not(.disabled) { background: #f8f8f8; }

    .opt.wrong   { background: #FCEBEB; border-color: #A32D2D; color: #791F1F; }

    .opt-letter {
      font-size: 12px;
      font-weight: 500;
      min-width: 22px;
      color: #aaa;
      font-family: 'Segoe UI', Arial, sans-serif;

    .opt-text-he {
      direction: rtl;
      text-align: right;
      flex: 1;
      unicode-bidi: embed;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    .opt-code {
      background-color: #f5f5f5;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .explanation {
      display: none;
      margin-top: 12px;
      padding: 10px 14px;
      font-size: 13px;
      color: #555;
      line-height: 2;
      border-right: 3px solid var(--color-main);
      background: #f8f8f8;
      direction: rtl;
      text-align: right;
    }

    .explanation.show { display: block; }

    .exp-line {
      display: block;
      direction: rtl;
      text-align: right;
    }

    .exp-code {
      display: block;
      direction: ltr;
      text-align: left;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      background: #fff;
      padding: 3px 8px;
      border-radius: 4px;
      margin: 2px 0;
    }

    .next-btn {
      display: none;
      margin-top: 1rem;
      padding: 10px 22px;
      border: 1px solid var(--color-main);
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      font-size: 14px;
      color: var(--color-dark);
      font-family: inherit;
    }

    .next-btn:hover { background: var(--color-light); }
    .next-btn.show  { display: inline-block; }

    .score-box {
      text-align: center;
      padding: 3rem 1rem;
    }

    .score-num {
      font-size: 56px;
      font-weight: 500;
      color: #1a1a1a;
    }

    .score-label {
      font-size: 16px;
      color: #666;
      margin-top: 8px;
    }

    .score-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }

    .restart-btn {
      padding: 10px 28px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      color: #1a1a1a;
    }

    .restart-btn:hover { background: #f5f5f5; }

    .home-return-btn {
      padding: 10px 28px;
      border: 1px solid var(--color-main);
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      color: var(--color-dark);
    }

    .home-return-btn:hover { background: var(--color-light); }
  </style>

  <div class="container">

    <!-- מסך פתיחה -->
    <div id="screen-home">

  <script>

    /* ══════════════════════════════════════════════════════════════
       הכנס כאן את שאלות העברית
       כל שאלה במבנה הבא:
       {
         topic: "נושא השאלה",
         textParts: [
           { type: "he",   text: "טקסט עברי" },
           { type: "code", text: "קוד" },
           { type: "he",   text: "המשך טקסט" }
         ],
         code: `קוד Java`,
         options: ["תשובה א", "תשובה ב", "תשובה ג", "תשובה ד"],
         answer: 0,
         explanation: [
           { type: "he",   text: "הסבר" },
           { type: "code", text: "קוד" }
         ]
       }
    ══════════════════════════════════════════════════════════════ */
    const questionsHe = [
  {
    "topic": "חיפוש לפי מזהה — עקיבה",
    "text": "מה יחזיר הקוד?",
    "code": "public boolean rentCarById(String id) {\n    for (int i = 0; i < _size; i++) {\n        if (_cars[i].getId().equals(id)) {\n            if (!_cars[i].isAvail())\n                return false;\n            _cars[i].rentCar();\n            return true;\n        }\n    }\n    return false;\n}\n// המערך מכיל:\n// [Toyota A 12345 true, Honda B 67890 false, Ford B 54321 true]\n// קריאה:\nrentCarById(\"67890\");",
    "options": [
      {
        "type": "code",
        "text": "false  // רכב קיים אך לא זמין"
      },
      {
        "type": "code",
        "text": "true   // ההשכרה הצליחה"
      },
      {
        "type": "code",
        "text": "false  // המספר לא נמצא"
      },
      {
        "type": "code",
        "text": "true   // כל רכב ניתן להשכרה"
      }
    ],
    "answer": 0,
    "explanation": [
      {
        "type": "he",
        "text": "הרכב 67890 נמצא במערך — אך תכונת הזמינות שלו היא false (לא זמין)."
      },
      {
        "type": "he",
        "text": "הקוד מזהה שהרכב אינו זמין ומחזיר false לפני ביצוע ההשכרה."
      },
      {
        "type": "code",
        "text": "i=0: 12345==67890? לא\ni=1: 67890==67890? כן\n  isAvail()? false → return false"
      }
    ],
    "textParts": [
      {
        "type": "he",
        "text": "מה יחזיר הקוד?"
      }
    ]
  },
  {
    "topic": "חיפוש — מזהה לא קיים",
    "text": "מה יחזיר הקוד כאשר המזהה אינו קיים במערך?",
    "code": "public boolean rentCarById(String id) {\n    for (int i = 0; i < _size; i++) {\n        if (_cars[i].getId().equals(id)) {\n            if (!_cars[i].isAvail())\n                return false;\n            _cars[i].rentCar();\n            return true;\n        }\n    }\n    return false;\n}\n// המערך מכיל:\n// [Toyota A 12345 true, Honda B 67890 true]\n// קריאה:\nrentCarById(\"99999\");",
    "options": [
      {
        "type": "code",
        "text": "false  // הלולאה הסתיימה ללא מציאה"
      },
      {
        "type": "code",
        "text": "true   // ברירת המחדל היא true"
      },
      {
        "type": "code",
        "text": "false  // רכב לא זמין"
      },
      "שגיאת ריצה NullPointerException"
    ],
    "answer": 0,
    "explanation": [
      {
        "type": "he",
        "text": "הלולאה עוברת על כל הרכבים ולא מוצאת את המזהה 99999. לאחר סיום הלולאה מוחזר false — הרכב לא נמצא."
      },
      {
        "type": "code",
        "text": "i=0: 12345==99999? לא\ni=1: 67890==99999? לא\n// הלולאה הסתיימה\nreturn false"
      }
    ],
    "textParts": [
      {
        "type": "he",
        "text": "מה יחזיר הקוד כאשר המזהה אינו קיים במערך?"
      }
    ]
  },
  {
    "topic": "הסרה ללא שמירת סדר — עקיבה",
    "text": "מה יהיה תוכן המערך לאחר הסרת הרכב עם המזהה 15442?",
    "code": "public boolean removeCar(String id) {\n    for (int i = 0; i < _size; i++) {\n        if (_cars[i].getId().equals(id)) {\n            _cars[i] = _cars[_size - 1];\n            _cars[_size - 1] = null;\n            _size--;\n            return true;\n        }\n    }\n    return false;\n}\n// לפני: [Toyota/12345, Honda/15442, Ford/54321, Mazda/96371]\n// _size = 4\nremoveCar(\"15442\");",
    "options": [
      "Toyota/12345, Mazda/96371, Ford/54321",
      "Toyota/12345, Ford/54321, Mazda/96371",
      "Toyota/12345, null, Ford/54321, Mazda/96371",
      "Honda/15442, Ford/54321, Mazda/96371"
    ],
    "answer": 0,
    "explanation": [
      {
        "type": "he",
        "text": "הרכב ב-i=1 (Honda/15442) מוחלף באיבר האחרון (Mazda/96371), ואז האחרון מוחק."
      },
      {
        "type": "he",
        "text": "הסדר אינו נשמר — Mazda עוברת למקום 1. זו שיטת ה-swap-with-last."
      },
      {
        "type": "code",
        "text": "i=1: cars[1] = cars[3]  // Mazda → מקום 1\ncars[3] = null\n_size--  // _size=3\n// תוצאה: [Toyota, Mazda, Ford]"
      }
    ],
    "textParts": [
      {
        "type": "he",
        "text": "מה יהיה תוכן המערך לאחר הסרת הרכב עם המזהה 15442?"
      }
    ]
  },
  {
    "topic": "בעיית החור בהסרה",
    "text": "מה הבעיה בגרסה הבאה של removeCar?",
    "code": "public boolean removeCar(String id) {\n    for (int i = 0; i < _size; i++) {\n        if (_cars[i].getId().equals(id)) {\n            _cars[i] = null;  // רק מחיקה!\n            return true;\n        }\n    }\n    return false;\n}",
    "options": [
      "נוצר חור — תא null בתוך האיברים הפעילים, מה שישבש לולאות עתידיות",
      "התכונה size לא מתעדכנת ואורך המערך גדל",
      "הקוד גורם לשגיאת NullPointerException מיידית",
      "אין בעיה — null הוא ערך חוקי במערך אובייקטים"
    ],
    "answer": 0,
    "explanation": [
      {
        "type": "he",
        "text": "אחרי ההסרה יש null בתוך האיברים הפעילים. לולאה עתידית שתנסה לגשת לשדה של אותו תא תגרום לשגיאת NullPointerException."
      },
      {
        "type": "he",
        "text": "בנוסף, התכונה size לא עודכנה — המערך 'חושב' שיש עדיין n איברים."
      },
      {
        "type": "code",
        "text": "// after _cars[1] = null:\n// [Toyota, null, Ford, Mazda]  ← hole!\n// another method:\n_cars[1].getId()  → NullPointerException!"
      }
    ],
    "textParts": [
      {
        "type": "he",
        "text": "מה הבעיה בגרסה הבאה של removeCar?"
      }
    ]

    /* ══════════════════════════════════════════════════════════════
       לוגיקה — אין צורך לשנות כלום מכאן והלאה
    ══════════════════════════════════════════════════════════════ */

    function shuffleOptions(questions) {
      return questions.map(q => {
        const indices = q.options.map((_, i) => i);
        for (let i = indices.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [indices[i], indices[j]] = [indices[j], indices[i]];
        }
        const newOptions = indices.map(i => q.options[i]);
        const newAnswer  = indices.indexOf(q.answer);
        return { ...q, options: newOptions, answer: newAnswer };
      });
    }

    let shuffledHe = [];
    let shuffledAr = [];

    const state = { he: { current: 0, score: 0 }, ar: { current: 0, score: 0 } };

    const ui = {
      he: {
        next: (c, t) => c === t - 1 ? 'סיום וראה ציון' : 'לשאלה הבאה',
        scoreLabel: s => s >= 8 ? 'מצוין!' : s >= 6 ? 'טוב מאוד!' : s >= 4 ? 'לא רע, כדאי לחזור על החומר' : 'כדאי לחזור על לולאות for',
        restart: 'התחל מחדש',
        home: 'חזור לתפריט',
        qOf: (c, t) => `שאלה ${c} מתוך ${t}`
      },
      ar: {
        next: (c, t) => c === t - 1 ? 'إنهاء وعرض النتيجة' : 'السؤال التالي',
        scoreLabel: s => s >= 8 ? 'ممتاز!' : s >= 6 ? 'جيد جداً!' : s >= 4 ? 'لا بأس، يُنصح بمراجعة المادة' : 'يُنصح بمراجعة حلقات for',
        restart: 'ابدأ من جديد',
        home: 'العودة للقائمة',
        qOf: (c, t) => `سؤال ${c} من ${t}`
      }
    };

    function buildExplanation(lines) {
      return lines.map(l =>
        l.type === 'code'
          ? `<span class="exp-code">${l.text.replace(/\n/g, '<br>')}</span>`
          : `<span class="exp-line">${l.text}</span>`
      ).join('');
    }

    function buildQuestionText(parts) {
      return parts.map(p =>
        p.type === 'code'
          ? `<span class="q-text-code">${p.text}</span>`
          : `<span class="q-text-line">${p.text}</span>`
      ).join('');
    }

    function buildOption(option) {
      if (typeof option === 'object' && option.type === 'code') {
        return `<span class="opt-code">${option.text}</span>`;
      }
      const text = typeof option === 'string' ? option : String(option);
      // זיהוי טקסט עברי — מתחיל בתו עברי (לאחר הסרת ‏)
      const clean = text.replace(/‏/g, '').trim();
      const isHebrew = /^[֐-׿יִ-ﭏ]/.test(clean);
      if (isHebrew) {
        return `<span class="opt-text-he">${text}</span>`;
      }
      // קוד / אנגלית — נשאר LTR
      return `<span class="opt-code" style="background:none;padding:0;">${text}</span>`;
    }

    function render(lang) {
      const questions = lang === 'he' ? shuffledHe : shuffledAr;
      const s = state[lang], t = ui[lang], total = questions.length;
      const app = document.getElementById(`app-${lang}`);

      if (s.current >= total) {
        app.innerHTML = `<div class="score-box">
          <div class="score-num">${s.score}/${total}</div>
          <div class="score-label">${t.scoreLabel(s.score)}</div>
          <div class="score-actions">
            <button class="restart-btn" onclick="restartQuiz('${lang}')">${t.restart}</button>
            <button class="home-return-btn" onclick="goHome()">${t.home}</button>
          </div>
        </div>`;
        return;
      }

      const q = questions[s.current];
      const letters = ['A', 'B', 'C', 'D'];
      const pct = (s.current / total * 100).toFixed(0);

      app.innerHTML = `
        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
        <div class="q-card">
          <div class="q-meta">
            <span class="q-num-badge">${t.qOf(s.current + 1, total)}</span>
            <span class="q-topic">${q.topic}</span>
          </div>
          <div class="q-text">${buildQuestionText(q.textParts)}</div>
          <div class="code-block">${q.code}</div>
          <div class="options" id="opts-${lang}">
            ${q.options.map((o, i) => `<button class="opt" onclick="choose('${lang}',${i})"><span class="opt-letter">${letters[i]}.</span>${buildOption(o)}</button>`).join('')}
          </div>
          <div class="explanation" id="exp-${lang}">${buildExplanation(q.explanation)}</div>
          <button class="next-btn" id="nxt-${lang}" onclick="nextQ('${lang}')">${t.next(s.current, total)}</button>
        </div>`;
    }

    function choose(lang, idx) {
      const questions = lang === 'he' ? shuffledHe : shuffledAr;
      const q = questions[state[lang].current];
      const opts = document.querySelectorAll(`#opts-${lang} .opt`);
      opts.forEach(o => o.classList.add('disabled'));
      opts[idx].classList.add(idx === q.answer ? 'correct' : 'wrong');
      if (idx !== q.answer) opts[q.answer].classList.add('correct');
      document.getElementById(`exp-${lang}`).classList.add('show');
      document.getElementById(`nxt-${lang}`).classList.add('show');
      if (idx === q.answer) state[lang].score++;
    }

    function nextQ(lang) { state[lang].current++; render(lang); }

    function restartQuiz(lang) {
      state[lang] = { current: 0, score: 0 };
      if (lang === 'he') shuffledHe = shuffleOptions(questionsHe);
      else               shuffledAr = shuffleOptions(questionsAr);
      render(lang);
    }

    function startQuiz(lang) {
      if (lang === 'he') shuffledHe = shuffleOptions(questionsHe);
      else               shuffledAr = shuffleOptions(questionsAr);
      state[lang] = { current: 0, score: 0 };
      document.getElementById('screen-home').style.display = 'none';
      document.getElementById(`screen-${lang}`).style.display = 'block';
      render(lang);
    }

    function goHome() {
      document.getElementById('screen-he').style.display = 'none';
      document.getElementById('screen-ar').style.display = 'none';
      document.getElementById('screen-home').style.display = 'flex';
    }

  </script>
